<script>
const COUNTRY={DE:'Германия',FR:'Франция',NL:'Нидерланды',GB:'Великобритания',US:'США',ES:'Испания'};
const SEPA_COUNTRIES=['DE','FR','NL','ES'];
const CURRENCY=['EUR','USD','GBP'];
const S={flow:'in',screen:'in-details',inCurrency:'EUR',inRail:'SEPA',outCurrency:'EUR',sourceCurrency:'USD',outRail:'SEPA',country:'DE',amount:'',recipientName:'',bankDemoId:'',iban:'',account:'',bic:'',bank:'',routing:'',bankAddress:'',recipientAddress:'',intermediary:'',purpose:'personal',purposeOther:'',note:'',showError:false};
const SCREENS={in:[['in-details','Реквизиты'],['in-pending','Поступление ожидается'],['in-success','Зачислено'],['in-held','На проверке']],out:[['out-config','Параметры перевода'],['out-recipient','Реквизиты получателя'],['out-review','Подтверждение'],['out-progress','Обрабатывается'],['out-success','Доставлен'],['out-failed','Ошибка'],['out-held','На проверке'],['out-unavailable','Недоступное направление']]};
const META={
'in-details':{title:'Один экран: валюта → метод → реквизиты',desc:'Без хлебных крошек, подзаголовка и повторяющегося названия внутри блока. Реквизиты меняются сразу под переключателями.',apis:['GET /v3/config/payment-methods/iban','POST /v3/iban','GET /v3/iban (список счетов)'],rules:['Реквизиты выводятся из ответа сервера, а не генерируются клиентом.','SEPA показан только для EUR; входящий SWIFT — демонстрационная гипотеза до подтверждения MID.','Если реквизиты не выданы, показывать состояние недоступности, а не фальшивые реквизиты.']},
'in-pending':{title:'Ожидание входящего перевода',desc:'Статус имеет смысл только для установленного системой входящего платежа. Вручную подтверждать отправку из чужого банка недостаточно.',apis:['Webhook / входящий депозит','GET /v3/iban/balance'],rules:['Состояние обновляется по данным сервера.','Не обещать срок зачисления без данных провайдера.']},
'in-success':{title:'Зачисление',desc:'Деньги доступны после сопоставления депозита и проверок.',apis:['Webhook / статус зачисления','GET /v3/iban/balance'],rules:['Показывать фактическую сумму и валюту.']},
'in-held':{title:'Проверка входящего',desc:'Платёж найден, но ещё не доступен для использования.',apis:['Order matching / compliance','GET /v3/iban/balance'],rules:['Не приравнивать обнаруженный депозит к доступным средствам.']},
'out-config':{title:'Параметры вывода',desc:'На первом шаге сумма и валюты + компактный переключатель SEPA/SWIFT на одном экране.',apis:['GET /v3/config/supported-currencies','GET /v3/config/payment-methods?direction=withdraw','GET /v3/exchange-rates'],rules:['SEPA доступен в демо только при EUR и стране из SEPA-списка.','В боевой версии определять доступность по MID и возвращённым paymentCode.','Курсы и комиссии здесь условные.']},
'out-recipient':{title:'Форма реквизитов физического лица',desc:'Нет переключателя «физлицо / компания» и нет корпоративных полей. Назначение перенесено сюда, чтобы не добавлять отдельный шаг.',apis:['POST /v3/recipients/mandatory-fields','POST /v3/recipients/individual','POST /v3/orders (purposeCode)'],rules:['Обязательные поля зависят от страны, валюты и платёжного метода.','Расширенные SWIFT-поля показаны как условные.','Имена и реквизиты сохраняются при возврате на предыдущий шаг.']},
'out-review':{title:'Проверка перед отправкой',desc:'Метод → ФИО → Страна → Счёт → Назначение → Расчёт. Подтверждение производится кнопкой, без чекбокса.',apis:['GET /v3/exchange-rates','POST /v3/orders'],rules:['Перед реальным созданием заказа обновить quote.','Повторное нажатие не должно создавать второй перевод.']},
'out-progress':{title:'Статус исходящего перевода',desc:'Запрос на перевод принят, но ещё не завершён.',apis:['POST /v3/orders','Webhook / Order status'],rules:['Ответ «заказ создан» не равен «деньги доставлены».','Повторять платеж до терминального статуса нельзя.']},
'out-success':{title:'Деньги получены банком',desc:'Финальное состояние, показываемое только после подтверждённого статуса провайдера.',apis:['fund_settled'],rules:['Квитанция и фактическая сумма поступают с бэкенда.']},
'out-failed':{title:'Неуспешный перевод',desc:'Показывать причину, если она доступна, и возможность изменить реквизиты.',apis:['fund_failed'],rules:['Повтор — новая операция с новым partnerId.']},
'out-held':{title:'Дополнительная проверка',desc:'Операция остаётся в обработке.',apis:['manual_review'],rules:['Не инициировать дублирующий перевод.','Запрашивать документы только при реальном требовании провайдера.']},
'out-unavailable':{title:'Маршрут недоступен',desc:'Показать ограничения выбранной комбинации страны, валюты и платёжного метода.',apis:['GET /v3/config/payment-methods'],rules:['Недоступный маршрут блокирует продолжение.']}
};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t){const n=$('toast');n.textContent=t;n.classList.add('visible');clearTimeout(window._to);window._to=setTimeout(()=>n.classList.remove('visible'),2300)}
function money(x,c){const n=Number(x);return Number.isFinite(n)?new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' '+(c==='USD'?'$':c):'—'}
function isSepa(){return S.outCurrency==='EUR'&&SEPA_COUNTRIES.includes(S.country)}
function configRail(){if(!isSepa()&&S.outRail==='SEPA')S.outRail='SWIFT'}
function setFlow(f){S.flow=f;S.screen=f==='in'?'in-details':'out-config';S.showError=false;render()}
function go(k){S.screen=k;S.showError=false;render()}
function goBack(){const b={'in-details':null,'in-pending':'in-details','in-success':'in-details','in-held':'in-details','out-config':null,'out-recipient':'out-config','out-review':'out-recipient','out-progress':'out-review','out-success':'out-config','out-failed':'out-recipient','out-held':'out-progress','out-unavailable':'out-config'};if(b[S.screen])go(b[S.screen]);else notify('Возврат в основной раздел приложения находится за пределами этого прототипа')}
function setIncomingCurrency(v){S.inCurrency=v;if(v!=='EUR')S.inRail='SWIFT';render()}
function setIncomingRail(v){if(v==='SEPA'&&S.inCurrency!=='EUR')return;S.inRail=v;render()}
function setOutCurrency(v){S.outCurrency=v;configRail();render()}
function setOutCountry(v){S.country=v;configRail();render()}
function setOutRail(v){if(v==='SEPA'&&!isSepa())return;S.outRail=v;render()}
function setSourceCurrency(v){S.sourceCurrency=v;render()}
function store(k,v){S[k]=v;uxUpdateFlowCTA()}
function segment(options,selected,fn){return `<div class="seg tf-seg" role="group">${options.map(o=>`<button type="button" class="${o.v===selected?'on':''}" ${o.disabled?'disabled title="Недоступно для выбранных параметров"':''} aria-pressed="${o.v===selected}" onclick="${fn}('${esc(o.v)}')">${esc(o.label??o.v)}</button>`).join('')}</div>`}
// SVG icon primitives follow the original alt.vu style (24px viewBox, 1.8–2.2px strokes).



const fieldIcon=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--n850)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M3.5 10h17"/></svg>`;
const tfFieldIcons={"person":"<circle cx=\"12\" cy=\"8\" r=\"3.4\"/><path d=\"M5 20v-2a7 7 0 0 1 14 0v2\"/>","card":"<rect x=\"3.4\" y=\"5.3\" width=\"17.2\" height=\"13.4\" rx=\"2.6\"/><path d=\"M3.4 10.2h17.2\"/>","bank":"<path d=\"M2.8 9.5 12 4l9.2 5.5\"/><path d=\"M4.4 10.2h15.2M5.5 10.2V19m4.3-8.8V19m4.4-8.8V19m4.3-8.8V19M3 20h18\"/>","globe":"<circle cx=\"12\" cy=\"12\" r=\"8.6\"/><path d=\"M3.4 12h17.2M12 3.4c-4.5 5.7-4.5 11.5 0 17.2M12 3.4c4.5 5.7 4.5 11.5 0 17.2\"/>","map":"<path d=\"M12 21s7.2-7 7.2-12a7.2 7.2 0 0 0-14.4 0C4.8 14 12 21 12 21Z\"/><circle cx=\"12\" cy=\"9.2\" r=\"2.3\"/>","coin":"<ellipse cx=\"12\" cy=\"6.4\" rx=\"7.4\" ry=\"3.1\"/><path d=\"M4.6 6.4v5.2c0 1.7 3.3 3.1 7.4 3.1s7.4-1.4 7.4-3.1V6.4M4.6 11.6v5.2c0 1.7 3.3 3.1 7.4 3.1s7.4-1.4 7.4-3.1v-5.2\"/>","note":"<path d=\"M7 3.5h9l3 3V20H5V3.5h2Z\"/><path d=\"M16 3.5V7h3M8 11h8M8 15h6\"/>"};
const tfFieldMap={"firstName":"person","lastName":"person","iban":"card","account":"card","bic":"globe","bank":"bank","intermediary":"bank","country":"globe","amount":"coin","routing":"note","bankAddress":"map","recipientAddress":"map","purpose":"note","purposeOther":"note","currency":"card"};





// aria-disabled allows an inactive-looking CTA to explain its validation error.



function getRequisites(){const eur=S.inCurrency==='EUR';const sepa=S.inRail==='SEPA';let rows=[['Получатель','Имя владельца счёта']];if(sepa){rows.push(['IBAN','DE00 0000 0000 0000 0000 00'],['BIC / SWIFT','DEMOXXXX'],['Банк','Банк-партнёр'],['Страна банка','Германия']);}else if(eur){rows.push(['IBAN / номер счёта','DE00 0000 0000 0000 0000 00'],['SWIFT / BIC','DEMOXXXX'],['Банк','Банк-партнёр'],['Адрес банка','Адрес предоставит TransFi']);}else{rows.push(['Номер счёта','000000000000'],['SWIFT / BIC',S.inCurrency==='USD'?'DEMOUS00':'DEMOGB00'],['Банк','Банк-партнёр'],['Адрес банка','Адрес предоставит TransFi']);}rows.push(['Назначение / Reference','DEMO-REF-000123']);return rows}
function copyText(v){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(v).then(()=>notify('Скопировано')).catch(()=>fallbackCopy(v));else fallbackCopy(v)}
function fallbackCopy(v){let e=document.createElement('textarea');e.value=v;document.body.appendChild(e);e.select();let ok=false;try{ok=document.execCommand('copy')}catch{}e.remove();notify(ok?'Скопировано':'Копирование недоступно в этом браузере')}
function copyAll(){copyText(getRequisites().map(([k,v])=>`${k}: ${v}`).join('\n'))}

function numAmount(){return Number(String(S.amount).replace(',','.'))}
function quote(){const amt=numAmount();const valid=Number.isFinite(amt)&&amt>0;const fx=S.sourceCurrency===S.outCurrency?1:({'EURUSD':1.08,'USDEUR':.9259,'EURGBP':.84,'GBPEUR':1.1905,'USDGBP':.7778,'GBPUSD':1.2857})[S.sourceCurrency+S.outCurrency]||1;const fee=S.outRail==='SEPA'?2.5:18;return {valid,amt,fx,fee,total:amt+fee,receive:Math.max(0,amt*fx),min:fee+.01}}
// Conversion amount is received in EUR (or chosen currency).
// Fee is charged in USD on top of the USD debit. .row.tot matches native review.
function qSummary(includeAmount=true){
 const q=quote();
 const row=(label,value,total=false)=>'<div class="row'+(total?' tot':'')+'"><div class="rt">'+esc(label)+'</div><div class="rv">'+esc(value)+'</div></div>';
 const from=S.sourceCurrency==='USD'?'$':S.sourceCurrency;
 return (includeAmount?row('Сумма перевода',money(q.receive,S.outCurrency)):'')+
   row('Курс','1 '+from+' ≈ '+q.fx.toFixed(4)+' '+S.outCurrency)+
   row('Комиссия',money(q.fee,S.sourceCurrency))+
   row('Спишется со счёта',money(q.total,S.sourceCurrency),true);
}
function validConfig(){
 const q=quote();
 return q.valid&&q.amt>q.fee&&q.amt+q.fee<=4812.60;
}
function uxConfigValidation(){
 const q=quote();
 if(!q.valid)return {message:'Укажите сумму перевода',field:'tf-out-amount'};
 if(q.amt<=q.fee)return {message:'Сумма перевода должна быть больше комиссии',field:'tf-out-amount'};
 if(q.amt+q.fee>4812.60)return {message:'Недостаточно средств с учётом комиссии',field:'tf-out-amount'};
 return null;
}
function uxRecipientValidation(){
 const name=String(S.recipientName||'').trim();
 if(!name)return {message:'Укажите имя и фамилию получателя',field:'f-recipientName'};
 if(name.split(/\s+/).filter(Boolean).length<2)return {message:'Введите имя и фамилию получателя полностью',field:'f-recipientName'};
 const required=S.outRail==='SEPA'?
   [['iban','Укажите IBAN получателя']]:
   [['account','Укажите номер счёта получателя'],['bic','Укажите SWIFT / BIC банка получателя'],['bank','Укажите наименование банка получателя']];
 if(!String(S.purpose||'').trim())required.push(['purpose','Выберите назначение перевода']);
 if(S.purpose==='other')required.push(['purposeOther','Уточните назначение перевода']);
 for(const [field,message] of required){
   if(!String(S[field]||'').trim())return {message,field:'f-'+field};
 }
 return null;
}
function uxUpdateFlowCTA(){
 const footer=$('footer');
 if(!footer||S.flow!=='out')return;
 const button=footer.querySelector('button.tf-button');
 if(!button||!['out-config','out-recipient'].includes(S.screen))return;
 const invalid=S.screen==='out-config'?uxConfigValidation():uxRecipientValidation();
 const inactive=Boolean(invalid);
 button.classList.toggle('tf-inactive',inactive);
 button.setAttribute('aria-disabled',String(inactive));
 const message=footer.querySelector('.tf-submit-error');
 if(message){message.hidden=true;message.textContent='';}
}
function uxFormError(error){
 if(!error)return;
 notify(error.message);
 const footer=$('footer');
 if(footer){
   let hint=footer.querySelector('.tf-submit-error');
   if(!hint){hint=document.createElement('div');hint.className='tf-submit-error';hint.setAttribute('role','alert');footer.appendChild(hint);}
   hint.textContent=error.message;hint.hidden=false;
 }
 const input=$(error.field);
 if(input){input.scrollIntoView({block:'center',behavior:'smooth'});input.focus();}
}
function checkConfig(){
 const invalid=uxConfigValidation();
 if(invalid){uxFormError(invalid);return;}
 go('out-recipient');
}
function checkRecipient(){
 const invalid=uxRecipientValidation();
 if(invalid){uxFormError(invalid);return;}
 go('out-review');
}
function fillDemo(){
 Object.assign(S,{recipientName:'Иван Иванов',iban:'DE00 0000 0000 0000 0000 00',account:'000000000000',
 bic:'DEMOXXXX',bank:'Банк-партнёр',routing:'',bankAddress:'',recipientAddress:'',
 intermediary:'',purpose:'personal',purposeOther:'',note:''});
 render();
 notify('Заполнены вымышленные тестовые данные');
}
function checkReview(){
 if(!validConfig()){notify('Проверьте сумму перевода');go('out-config');return;}
 S.bankDemoId='tf-bank-'+Date.now()+'-'+Math.floor(Math.random()*100000);
 go('out-progress');
 uxBankEmit('pending');
}
// Test prototype callbacks: status updates come from the payment provider in
// production; never simulate their arrival automatically.
function uxBankCallback(status){
 const screens={pending:'out-progress',success:'out-success',failed:'out-failed',held:'out-held'};
 if(S.flow!=='out'||!screens[status]||!['out-progress','out-held','out-failed','out-success'].includes(S.screen))return false;
 go(screens[status]);uxBankEmit(status);return true;
}
function uxBankEmit(status){
 if(window.parent===window||!S.bankDemoId)return;
 const q=quote();
 window.parent.postMessage({
  type:'altvu:bank:status',id:S.bankDemoId,rail:S.outRail,flow:'out',
  status,amount_minor:-Math.round(q.total*100),

function uxBankMaxCents(){

function uxBankCleanAmount(raw){
  const s=String(raw||'').replace(/[\s\u00a0\u202f]/g,'').replace(/,/g,'.').replace(/[^\d.]/g,'');
  const dot=s.indexOf('.');
  let whole=(dot<0?s:s.slice(0,dot)).replace(/^0+(?=\d)/,'').slice(0,7);
  const fraction=dot<0?'':s.slice(dot+1).replace(/\D/g,'').slice(0,2);
  if(dot>=0&&!whole)whole='0';
  return whole+(dot<0?'':'.'+fraction);
}
function uxBankGroupAmount(value){
  const s=String(value||'');
  const dot=s.indexOf('.');
  const whole=(dot<0?s:s.slice(0,dot)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return whole+(dot<0?'':s.slice(dot));
}
function uxBankAmountInput(input){
  const raw=input.value,caret=input.selectionStart==null?raw.length:input.selectionStart;
  const cleaned=uxBankCleanAmount(raw);
  const shown=uxBankGroupAmount(cleaned);
  const offset=Math.min(shown.length,uxBankGroupAmount(uxBankCleanAmount(raw.slice(0,caret))).length);
  input.value=shown;
  input.setSelectionRange(offset,offset);
  S.amount=cleaned;

  uxUpdateFlowCTA();
}
function uxBankAmountBeforeInput(e,input){
  if(input.selectionStart!==input.selectionEnd)return;
  const caret=input.selectionStart,raw=input.value;
  if(e.inputType==='deleteContentBackward'&&caret>1&&raw[caret-1]===' '){
    e.preventDefault();
    const cut=caret-2;
    input.value=raw.slice(0,cut)+raw.slice(caret);
    input.setSelectionRange(cut,cut);
    uxBankAmountInput(input);
  }else if(e.inputType==='deleteContentForward'&&raw[caret]===' '&&caret+1<raw.length){
    e.preventDefault();
    input.value=raw.slice(0,caret)+raw.slice(caret+2);
    input.setSelectionRange(caret,caret);
    uxBankAmountInput(input);
  }
}

// merely supplies the full demo currency/country options; it is never shown.
// A picker is a reusable field, not a complete bank transfer screen.
if(tfQuery.get('component')==='picker'){
  const kind=tfQuery.get('kind');
  if(kind==='country'||kind==='currency'){
    S.flow='out';
    S.screen='out-config';
    S.outRail='SWIFT';
    S.modal=null;
    S.componentPickerKey=kind==='country'?'country':'outCurrency';
    S.componentPickerLabel=kind==='country'?'Страна':'Валюта';
    document.documentElement.classList.add('tf-capture','tf-embedded','tf-component-only');
  }
}
render();
// A component catalog starts with its picker ALREADY OPEN, with animations
// settled. There is no initial movement of the dimmed trigger in the iframe.
// Closing and reopening restores the original ALT.VU entrance animation.
if(S.componentPickerKey)uxOpenPicker(S.componentPickerKey,{settled:true,focus:false});
// Component-catalog / Playwright capture only: render an actual opened selector
// using the very same DOM, CSS and event handlers as the working bank flow.
if(tfQuery.get('capture')==='1'){
  const examplePicker=tfQuery.get('picker');
  const visiblePicker=document.querySelector('.phone.tf-phone [data-picker="'+examplePicker+'"]');
  if(['country','inCurrency','outCurrency','purpose'].includes(examplePicker)&&visiblePicker){
    uxOpenPicker(examplePicker);
  }
}
// Isolated QA entry. Use the actual bank status screens and existing callback;
// test-only fictional prerequisites replace the manual form-entry sequence.
const tfQAEvent=tfQuery.get('qa-event');
if(tfQuery.get('capture')==='1'&&tfQuery.get('embedded')==='1'&&
   ['SEPA','SWIFT'].includes(queryRail)){
  if(S.flow==='out'&&['pending','success','failed','held'].includes(tfQAEvent)){
    Object.assign(S,{amount:'100',recipientName:'Тестовый получатель',
      iban:'DE00 0000 0000 0000 0000 00',account:'000000000000',
      bic:'DEMOXXXX',bank:'Demo International Bank',purpose:'personal',
      outRail:queryRail,outCurrency:queryRail==='SWIFT'?'GBP':'EUR',
      country:queryRail==='SWIFT'?'GB':'DE',
      bankDemoId:'tf-bank-'+Date.now()+'-'+Math.floor(Math.random()*100000)});
    go('out-progress');
    uxBankEmit('pending');
    if(tfQAEvent!=='pending')uxBankCallback(tfQAEvent);
  }else if(S.flow==='in'){
    const screens={details:'in-details',pending:'in-pending',
      success:'in-success',held:'in-held'};
    if(screens[tfQAEvent]){
      S.inRail=queryRail;
      S.inCurrency=queryRail==='SWIFT'?'GBP':'EUR';
      go(screens[tfQAEvent]);
    }
  }
}
</script>
</body></html>
