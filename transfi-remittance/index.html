*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px/1.44 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9fb4d4;outline-offset:2px}button{border:0}h1,h2,h3,p{margin-top:0}.top{height:66px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:12px}.brand{font-size:16px;font-weight:800;letter-spacing:-.5px}.brand span{color:#8e9aaa;font-weight:500}.chip{display:inline-block;padding:5px 9px;border-radius:99px;background:#eff3f7;color:#5a6e82;font-size:11px;font-weight:700}.chip.warn{background:#fff2df;color:#9c691d}.shell{display:grid;grid-template-columns:244px minmax(410px,1fr) 320px;min-height:calc(100vh - 66px);max-width:1540px;margin:auto}.sidebar{padding:25px 15px;background:#fff;border-right:1px solid var(--border)}.sideLabel{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#91a0ae;font-weight:800;margin:7px 10px 11px}.entry{width:100%;border:0;background:#fff;text-align:left;border-radius:12px;padding:13px 12px;display:flex;gap:12px;align-items:center;margin-bottom:7px;color:#516477}.entry:hover,.stepBtn:hover{background:#f5f7fa}.entry.active{background:#eaf1f8;color:#233f63}.entry .glyph{font-size:21px;width:29px;height:32px;display:grid;place-items:center;background:#edf2f7;border-radius:9px;color:var(--brand)}.entry b{display:block;font-size:13px}.entry small{display:block;color:#8c99a6;font-size:10px;margin-top:3px}.divider{height:1px;background:var(--border);margin:21px 9px}.stepBtn{width:100%;padding:10px 11px;border-radius:9px;text-align:left;display:flex;align-items:center;gap:10px;background:transparent;color:#637386;font-size:12px}.stepBtn.active{background:#eef3f9;color:var(- -size:12px;font-weight:750;margin-bottom:8px}.opt{font-size:10px;font-weight:500;color:#94a0ad}.segmented{display:flex;gap:5px;background:#eef2f6;border-radius:12px;padding:4px;min-height:44px}.segmented button{min-width:0;flex:1;padding:9px 8px;border-radius:9px;background:transparent;color:#607184;font-size:12px;font-weight:750;white-space:nowrap}.segmented button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 5px #23354b1c;color:#253f62}.segmented button:disabled{opacity:.32}.input,.select,.textarea{width:100%;border:1px solid #d6dfe8;color:#253849;background:#fff;border-radius:11px;padding:0 12px;min-height:46px}.textarea{padding:12px;min-height:68px}.input:focus,.select:focus,.textarea:focus{border-color:#7992b5;box-shadow:0 0 0 2px #e8eef6;outline:0}.input.invalid{border-color:#c56e75}.columns2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.amountwrap{display:flex;align-items:center;border:1px solid #d4dde7;border-radius:12px;overflow:hidden;margin-bottom:13px}.amountwrap input{font-weight:780;letter-spacing:-.65px;font-size:27px;min-width:0;flex:1;border:0;outline:0;padding:12px;width:100%}.amountwrap span{padding:12px 13px;background:#f5f8fb;border-left:1px solid #e1e7ee;font-size:13px;font-weight:800}.card{border:1px solid #e0e6ec;border-radius:15px;padding:14px;margin-bottom:14px;background:#fff}.card.soft{background:#f8fafc}.card h3{font-size:12px;margin:0 0 11px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.keyrow{padding:12px 0;border-bottom:1px solid #eef1f5;display:flex;justify-content:space-between;gap:11px;align-items:center}.keyrow:last-child{border:0;padding-bottom:0}.keyrow:first-child{padding-top:1px}.keyrow .k{font-size:11px;color:#798897;line-height:1.5}.keyrow .v{font-size:12px;font-weight:750;overflow-wrap:anywhere;text-align:right;line-height:1.5}.copy{display:inline-grid;place-items:center;border:1px solid #e3e9ee;background:#f6f8fb;color:#506782;border-radius:7px;width:30px;height:30px;font-size:13px;flex-shrink:0}.copyrow{border-bottom:1px solid #edf1f4;padding:13px 0;display:flex;gap:10px;align-items:center}.copyrow:last-child{border:0;padding-bottom:0}.copyrow:first-child{padding-top:2px}.copyrow>div{flex:1;min-width:0}.copyrow small{font-size:10px;color:#8492a1;display:block;margin-bottom:4px}.copyrow b{font-size:12px;overflow-wrap:anywhere;display:block;font-weight:740}.notice{background:#eef3f8;padding:12px 13px;border-radius:11px;color:#566c81;font-size:11px;line-height:1.55;margin:12px 0}.notice.warn{background:#fff4e6;color:#875e22}.notice.good{background:#e9f6ef;color:#267356}.notice.error{background:#fff0ef;color:#9d4149}.primary,.secondary,.quiet{width:100%;min-height:47px;border-radius:12px;font-size:13px;font-weight:800}.primary{background:var(--brand);color:#fff}.primary:hover{background:#355980}.secondary{background:#eef2f6;color:#344f70}.quiet{background:transparent;color:#3b5b80}.actions{display:grid;gap:8px}.muted{color:var(--muted)}.small{font-size:11px}.tiny{font-size:10px}.details{border:1px solid #e3e8ef;border-radius:13px;padding:0 12px;margin-bottom:14px}.details summary{list-style:none;padding:13px 0;cursor:pointer;font-weight:750;font-size:12px;display:flex;justify-content:space-between}.details summary:after{content:"⌄";font-size:15px}.details[open] summary{margin-bottom:7px;border-bottom:1px solid #e9edf1}.details summary::-webkit-details-marker{display:none}.details .field:last-child{margin-bottom:13px}.tick{display:flex;gap:10px;align-items:flex-start;color:#516579;font-size:11px;margin:12px 0}.tick input{margin-top:2px}.summaryHead{text-align:center;margin-bottom:18px}.badgeIcon{height:65px;width:65px;border-radius:21px;display:grid;place-items:center;font-size:34px;font-weight:700;margin:8px auto 19px;background:#edf3f9;color:#426384}.badgeIcon.success{background:#e8f7ef;color:#14754d}.badgeIcon.error{background:#ffefee;color:#b1484d}.badgeIcon.warn{background:#fff3dd;color:#a4731e}.timeline{margin:18px 0}.track{display:flex;gap:12px;min-height:65px}.track .dot{width:25px;height:25px;border-radius:50%;background:#edf2f7;border:1px solid #dce4ec;display:grid;place-items:center;font-size:11px;flex-shrink:0;color:#8294a7}.track.done .dot{background:#e3f4eb;color:#1f7755;border-color:#b8e0cb}.track.current .dot{background:#e7eff9;color:#355a89;border-color:#bbd1e9}.track .line{height:40px;width:1px;background:#e0e7ef;margin-left:12px}.track b{font-size:12px}.track small{display:block;font-size:10px;color:#8695a5;margin-top:4px}.status{font-size:10px;padding:5px 9px;border-radius:20px;background:#eef2f6;color:#5f758a;font-weight:750}.status.ok{background:#e9f5ed;color:#1f7655}.status.warn{background:#fff1df;color:#9e711f}.status.err{background:#ffeded;color:#ad4047}.apiBox{border-left:1px solid var(--border);padding:28px 21px 22px;background:#fafbfc}.apiBox h2{font-size:15px;margin-bottom:11px}.apiBox p,.apiBox li{font-size:11px;line-height:1.65;color:#6c7b8a}.apiBox ul{padding-left:17px}.apiChip{display:inline-block;background:#edf2f7;font:10px/1.4 ui-monospace,Consolas,monospace;color:#3e5976;border-radius:6px;padding:5px 7px;margin-bottom:6px;max-width:100%;overflow-wrap:anywhere}.simBtns{display:grid;gap:6px}.simBtns button{background:#fff;border:1px solid #dfe7ed;border-radius:9px;text-align:left;padding:10px 11px;color:#51667c;font-size:11px}.simBtns button:hover{background:#edf3f9}.alert{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);background:#233c58;color:#fff;border-radius:12px;padding:10px 15px;box-shadow:0 10px 30px #17344d45;font-size:12px;max-width:90vw;z-index:20;opacity:0;pointer-events:none;transition:opacity .15s}.alert.visible{opacity:1}.mobilemenu{display:none}.req{color:#a64f52;font-weight:700}.previewFoot{font-size:11px;color:#8695a6;text-align:center;margin-top:8px}
@media(max-width:1100px){.shell{grid-template-columns:220px minmax(400px,1fr)}.apiBox{display:none}}
@media(max-width:760px){.top{height:52px;padding:0 15px}.top .chip.warn{display:none}.shell{display:block;min-height:calc(100vh - 52px)}.sidebar{display:none}.mobilemenu{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px 0}.mobilemenu button{border:1px solid #dce4ec;background:#fff;color:#5d7085;padding:10px 5px;border-radius:11px;font-size:12px;font-weight:750}.mobilemenu button.active{background:#e9f0f8;border-color:#8ea9ca;color:#2e4e77}.workspace{padding:12px 7px 25px}.stage{padding:0 9px}.phone{width:min(402px,100%);height:min(805px,calc(100dvh - 150px));min-height:620px;border:5px solid #253041;border-radius:26px;box-shadow:none}.statusbar{height:24px}.content{padding:20px 18px}.apiBox{display:none}}

<body>
<header class="top"><div class="brand">TransFi <span>/ Международный перевод</span></div><div class="row" style="gap:7px"><span class="chip">UX · v5</span></div></header>
<div class="mobilemenu"><button data-flow="in" onclick="setFlow('in')">↓ Пополнение</button><button data-flow="out" onclick="setFlow('out')">↑ Вывод</button></div>
<div class="shell">
<aside class="sidebar">
 <div class="sideLabel">Точки входа в приложении</div>
 <button id="flow-in" class="entry" onclick="setFlow('in')"><span class="glyph">↓</span><span><b>Пополнение</b><small>Международный перевод</small></span></button>
 <button id="flow-out" class="entry" onclick="setFlow('out')"><span class="glyph">↑</span><span><b>Вывод</b><small>Международный перевод</small></span></button>
 <div class="divider"></div><div class="sideLabel">Экраны сценария</div><div id="stepList"></div>
 <div class="asidenote"><b>Граница сценария</b>Кошелёк, выбор способа пополнения и вывод денег уже реализованы в приложении. Здесь только экраны международного перевода.</div>
</aside>
<main class="workspace">
 <div class="stage"><span id="stageLabel"></span><span id="stageIndex"></span></div>
 <div class="phone">
  <div class="statusbar"><span>9:41</span><span>●●●  ◕  ▣</span></div>
  <div class="appheader"><button class="back" aria-label="Назад" onclick="goBack()">‹</button><div><h2 id="phoneTitle"></h2></div></div>
  <div class="content" id="content"></div>
  <div class="footer" id="footer"></div>
 </div>

</main>
<aside class="apiBox">
 <div class="sideLabel" style="margin-left:0">Пояснение к экрану</div><h2 id="metaTitle"></h2><p id="metaDescription"></p>
 <div class="divider" style="margin-left:0;margin-right:0"></div><div class="sideLabel" style="margin-left:0">API / бэкенд</div><div id="metaApi"></div>
 <div class="sideLabel" style="margin:18px 0 8px">Правила UX</div><ul id="metaRules"></ul>
 <div class="divider" style="margin-left:0;margin-right:0"></div><div class="sideLabel" style="margin-left:0">Демо-состояния</div><div class="simBtns" id="simList"></div>
</aside>
</div>
<div class="alert" id="toast" role="status" aria-live="polite"></div>
<script>
const COUNTRY={DE:'Германия',FR:'Франция',NL:'Нидерланды',GB:'Великобритания',US:'США',ES:'Испания'};
const SEPA_COUNTRIES=['DE','FR','NL','ES'];
const CURRENCY=['EUR','USD','GBP'];
const S={flow:'in',screen:'in-details',inCurrency:'EUR',inRail:'SEPA',outCurrency:'EUR',sourceCurrency:'EUR',outRail:'SEPA',country:'DE',amount:'1000',firstName:'',lastName:'',iban:'',account:'',bic:'',bank:'',routing:'',bankAddress:'',recipientAddress:'',intermediary:'',purpose:'personal',purposeOther:'',note:'',showError:false};
const SCREENS={in:[['in-details','Реквизиты'],['in-pending','Поступление ожидается'],['in-success','Зачислено'],['in-held','На проверке']],out:[['out-config','Параметры перевода'],['out-recipient','Реквизиты получателя'],['out-review','Подтверждение'],['out-progress','Обрабатывается'],['out-success','Доставлен'],['out-failed','Ошибка'],['out-held','На проверке'],['out-unavailable','Недоступное направление']]};
const META={
'in-details':{title:'Один экран: валюта → метод → реквизиты',desc:'Без хлебных крошек, подзаголовка и повторяющегося названия внутри блока. Реквизиты меняются сразу под переключателями.',apis:['GET /v3/config/payment-methods/iban','POST /v3/iban','GET /v3/iban (список счетов)'],rules:['Реквизиты выводятся из ответа сервера, а не генерируются клиентом.','SEPA показан только для EUR; входящий SWIFT — демонстрационная гипотеза до подтверждения MID.','Если реквизиты не выданы, показывать состояние недоступности, а не фальшивые реквизиты.']},
'in-pending':{title:'Ожидание входящего перевода',desc:'Статус имеет смысл только для установленного системой входящего платежа. Вручную подтверждать отправку из чужого банка недостаточно.',apis:['Webhook / входящий депозит','GET /v3/iban/balance'],rules:['Состояние обновляется по данным сервера.','Не обещать срок зачисления без данных провайдера.']},
'in-success':{title:'Зачисление',desc:'Деньги доступны после сопоставления депозита и проверок.',apis:['Webhook / статус зачисления','GET /v3/iban/balance'],rules:['Показывать фактическую сумму и валюту.']},
'in-held':{title:'Проверка входящего',desc:'Платёж найден, но ещё не доступен для использования.',apis:['Order matching / compliance','GET /v3/iban/balance'],rules:['Не приравнивать обнаруженный депозит к доступным средствам.']},
'out-config':{title:'Параметры вывода',desc:'На первом шаге сумма и валюты + компактный переключатель SEPA/SWIFT на одном экране.',apis:['GET /v3/config/supported-currencies','GET /v3/config/payment-methods?direction=withdraw','GET /v3/exchange-rates'],rules:['SEPA доступен в демо только при EUR и стране из SEPA-списка.','В боевой версии определять доступность по MID и возвращённым paymentCode.','Курсы и комиссии здесь условные.']},
'out-recipient':{title:'Форма реквизитов физического лица',desc:'Нет переключателя «физлицо / компания» и нет корпоративных полей. Назначение перенесено сюда, чтобы не добавлять отдельный шаг.',apis:['POST /v3/recipients/mandatory-fields','POST /v3/recipients/individual','POST /v3/orders (purposeCode)'],rules:['Обязательные поля зависят от страны, валюты и платёжного метода.','Расширенные SWIFT-поля показаны как условные.','Имена и реквизиты сохраняются при возврате на предыдущий шаг.']},
'out-review':{title:'Проверка перед отправкой',desc:'Метод → ФИО → Страна → Счёт → Назначение → Расчёт. Подтверждение производится кнопкой, без чекбокса.',apis:['GET /v3/exchange-rates','POST /v3/orders'],rules:['Перед реальным созданием заказа обновить quote.','Повторное нажатие не должно создавать второй перевод.']},
'out-progress':{title:'Статус исходящего перевода',desc:'Запрос на перевод принят, но ещё не завершён.',apis:['POST /v3/orders','Webhook / Order status'],rules:['Ответ «заказ создан» не равен «деньги доставлены».','Повторять платеж до терминального статуса нельзя.']},
'out-success':{title:'Деньги получены банком',desc:'Финальное состояние, показываемое только после подтверждённого статуса провайдера.',apis:['fund_settled'],rules:['Квитанция и фактическая сумма поступают с бэкенда.']},
'out-failed':{title:'Неуспешный перевод',desc:'Показывать причину, если она доступна, и возможность изменить реквизиты.',apis:['fund_failed'],rules:['Повтор — новая операция с новым partnerId.']},
'out-held':{title:'Дополнительная проверка',desc:'Операция остаётся в обработке.',apis:['manual_review'],rules:['Не инициировать дублирующий перевод.','Запрашивать документы только при реальном требовании провайдера.']},
'out-unavailable':{title:'Маршрут недоступен',desc:'Показать ограничения выбранной комбинации страны, валюты и платёжного метода.',apis:['GET /v3/config/payment-methods'],rules:['Недоступный маршрут блокирует продолжение.']}
};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t){const n=$('toast');n.textContent=t;n.classList.add('visible');clearTimeout(window._to);window._to=setTimeout(()=>n.classList.remove('visible'),2300)}
function money(x,c){const n=Number(x);return Number.isFinite(n)?new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' '+c:'—'}
function isSepa(){return S.outCurrency==='EUR'&&SEPA_COUNTRIES.includes(S.country)}
function configRail(){if(!isSepa()&&S.outRail==='SEPA')S.outRail='SWIFT'}
function setFlow(f){S.flow=f;S.screen=f==='in'?'in-details':'out-config';S.showError=false;render()}
function go(k){S.screen=k;S.showError=false;render()}
function goBack(){const b={'in-details':null,'in-pending':'in-details','in-success':'in-details','in-held':'in-details','out-config':null,'out-recipient':'out-config','out-review':'out-recipient','out-progress':'out-review','out-success':'out-config','out-failed':'out-recipient','out-held':'out-progress','out-unavailable':'out-config'};if(b[S.screen])go(b[S.screen]);else notify('Возврат в основной раздел приложения находится за пределами этого прототипа')}
function setIncomingCurrency(v){S.inCurrency=v;if(v!=='EUR')S.inRail='SWIFT';render()}
function setIncomingRail(v){if(v==='SEPA'&&S.inCurrency!=='EUR')return;S.inRail=v;render()}
function setOutCurrency(v){S.outCurrency=v;configRail();render()}
function setOutCountry(v){S.country=v;configRail();render()}
function setOutRail(v){if(v==='SEPA'&&!isSepa())return;S.outRail=v;render()}
function setSourceCurrency(v){S.sourceCurrency=v;render()}
function store(k,v){S[k]=v}
function segment(options,selected,fn){return `<div class="segmented" role="group">${options.map(o=>`<button type="button" ${o.disabled?'disabled title="Недоступно для выбранных параметров"':''} aria-pressed="${o.v===selected}" onclick="${fn}('${esc(o.v)}')">${esc(o.label??o.v)}</button>`).join('')}</div>`}
function title(text,sub,eyebrow){return `<h1 class="h1">${esc(text)}</h1>`}
function field(label,key,placeholder,{optional=false,hint='',type='text'}={}){return `<div class="field"><div class="fieldLabel"><span>${esc(label)} ${!optional?'<span class="req">*</span>':''}</span>${hint||optional?`<span class="opt">${esc(hint||'Если требуется')}</span>`:''}</div><input class="input" id="f-${key}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(S[key])}" oninput="store('${key}',this.value)" autocomplete="off"/></div>`}
function selectField(label,key,opts){return `<div class="field"><div class="fieldLabel">${esc(label)} <span class="req">*</span></div><select class="select" onchange="store('${key}',this.value);if('${key}'==='purpose')render()">${opts.map(x=>`<option value="${x[0]}" ${S[key]===x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select></div>`}
function keyrow(k,v){return `<div class="keyrow"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`}
function notice(text,t=''){return `<div class="notice ${t}">${esc(text)}</div>`}
function primary(t,click,disabled=false){return `<button class="primary" ${disabled?'disabled':''} onclick="${click}">${esc(t)}</button>`}
function second(t,click){return `<button class="secondary" onclick="${click}">${esc(t)}</button>`}
function action(t,click){return `<button class="quiet" onclick="${click}">${esc(t)}</button>`}
function getRequisites(){const eur=S.inCurrency==='EUR';const sepa=S.inRail==='SEPA';let rows=[['Получатель','Имя владельца счёта']];if(sepa){rows.push(['IBAN','DE00 0000 0000 0000 0000 00'],['BIC / SWIFT','DEMOXXXX'],['Банк','Банк-партнёр'],['Страна банка','Германия']);}else if(eur){rows.push(['IBAN / номер счёта','DE00 0000 0000 0000 0000 00'],['SWIFT / BIC','DEMOXXXX'],['Банк','Банк-партнёр'],['Адрес банка','Адрес предоставит TransFi']);}else{rows.push(['Номер счёта','000000000000'],['SWIFT / BIC',S.inCurrency==='USD'?'DEMOUS00':'DEMOGB00'],['Банк','Банк-партнёр'],['Адрес банка','Адрес предоставит TransFi']);}rows.push(['Назначение / Reference','DEMO-REF-000123']);return rows}
function copyText(v){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(v).then(()=>notify('Скопировано')).catch(()=>fallbackCopy(v));else fallbackCopy(v)}
function fallbackCopy(v){let e=document.createElement('textarea');e.value=v;document.body.appendChild(e);e.select();let ok=false;try{ok=document.execCommand('copy')}catch{}e.remove();notify(ok?'Скопировано':'Копирование недоступно в этом браузере')}
function copyAll(){copyText(getRequisites().map(([k,v])=>`${k}: ${v}`).join('\n'))}
function copyrow(k,v,i){return `<div class="copyrow"><div><small>${esc(k)}</small><b>${esc(v)}</b></div><button class="copy" aria-label="Скопировать: ${esc(k)}" title="Скопировать" onclick="copyText(getRequisites()[${i}][1])">⧉</button></div>`}
function numAmount(){return Number(String(S.amount).replace(',','.'))}
function quote(){const amt=numAmount();const valid=Number.isFinite(amt)&&amt>0;const fx=S.sourceCurrency===S.outCurrency?1:({'EURUSD':1.08,'USDEUR':.9259,'EURGBP':.84,'GBPEUR':1.1905,'USDGBP':.7778,'GBPUSD':1.2857})[S.sourceCurrency+S.outCurrency]||1;const fee=S.outRail==='SEPA'?2.5:18;return {valid,amt,fx,fee,receive:Math.max(0,(amt-fee)*fx),min:fee+.01}}
function qSummary(){const q=quote();return `${keyrow('Курс',`1 ${S.sourceCurrency} ≈ ${q.fx.toFixed(4)} ${S.outCurrency}`)}${keyrow('Сумма',money(q.amt,S.sourceCurrency))}${keyrow('Комиссия',money(q.fee,S.sourceCurrency))}${keyrow('Получит',money(q.receive,S.outCurrency))}`}
function validConfig(){const q=quote();return q.valid&&q.amt>q.fee}
function checkConfig(){if(!validConfig()){notify('Укажите сумму больше комиссии');return}go('out-recipient')}
function checkRecipient(){const required=['firstName','lastName',S.outRail==='SEPA'?'iban':'account'];if(S.outRail==='SWIFT')required.push('bic','bank');if(S.purpose==='other')required.push('purposeOther');const missing=required.find(k=>!String(S[k]||'').trim());if(missing){notify('Заполните обязательные поля');const f=$('f-'+missing);f?.scrollIntoView({block:'center',behavior:'smooth'});f?.focus();return}go('out-review')}
function fillDemo(){Object.assign(S,{firstName:'Иван',lastName:'Иванов',iban:'DE00 0000 0000 0000 0000 00',account:'000000000000',bic:'DEMOXXXX',bank:'Банк-партнёр',routing:'',bankAddress:'',recipientAddress:'',intermediary:'',purpose:'personal',purposeOther:'',note:''});render();notify('Заполнены вымышленные тестовые данные')}
function checkReview(){if(!validConfig()){notify('Проверьте сумму перевода');go('out-config');return}go('out-progress')}
function renderScreen(){const q=quote();let p='',f='',head='Международный перевод',subtitle=S.flow==='in'?'Пополнение':'Вывод';switch(S.screen){
case'in-details':{
const sepaEnabled=S.inCurrency==='EUR';const rows=getRequisites();p=`<div class="field"><div class="fieldLabel">Валюта поступления</div>${segment(CURRENCY.map(v=>({v})),S.inCurrency,'setIncomingCurrency')}</div>
<div class="field"><div class="fieldLabel">Способ перевода</div>${segment([{v:'SEPA',label:'SEPA',disabled:!sepaEnabled},{v:'SWIFT',label:'SWIFT'}],S.inRail,'setIncomingRail')}</div>
 <div class="card">${rows.map(([k,v],i)=>copyrow(k,v,i)).join('')}</div>`;
f=`${primary('Скопировать все реквизиты','copyAll()')}`;break}
case'in-pending':p=`${title('Ожидаем поступление','Операция отобразится в кошельке после получения подтверждения от банка.','Пополнение')}<span class="status warn">Ожидание</span>${timeline('in')}`;f=action('Вернуться к реквизитам',"go('in-details')");break;
case'in-success':p=`<div class="summaryHead"><div class="badgeIcon success">✓</div>${title('Деньги зачислены','Входящий перевод успешно обработан.','Пополнение')}</div><div class="card">${keyrow('Валюта',S.inCurrency)}${keyrow('Сумма','По факту зачисления')}${keyrow('Статус','Завершено')}</div>`;f=primary('К реквизитам',"go('in-details')");break;
case'in-held':p=`<div class="summaryHead"><div class="badgeIcon warn">⋯</div>${title('Поступление на проверке','Средства обнаружены, но пока недоступны для использования.','Пополнение')}</div><span class="status warn">На проверке</span><div class="card">${keyrow('Валюта',S.inCurrency)}${keyrow('Причина','Уточняется банком / провайдером')}${keyrow('Следующий шаг','Ожидание обновления')}</div>${notice('Деньги нельзя считать доступными до завершения проверок.','warn')}`;f=primary('К реквизитам',"go('in-details')");break;
case'out-config':p=`
<div class="field"><div class="fieldLabel">Валюта списания</div>${segment(CURRENCY.map(v=>({v})),S.sourceCurrency,'setSourceCurrency')}</div>
<div class="field"><div class="fieldLabel">Валюта получения</div>${segment(CURRENCY.map(v=>({v})),S.outCurrency,'setOutCurrency')}</div>
<div class="field"><div class="fieldLabel">Страна получателя</div><select class="select" aria-label="Страна получателя" onchange="setOutCountry(this.value)">${Object.entries(COUNTRY).map(([c,name])=>`<option value="${c}" ${S.country===c?'selected':''}>${esc(name)}</option>`).join('')}</select></div>
<div class="field"><div class="fieldLabel">Способ перевода</div>${segment([{v:'SEPA',disabled:!isSepa()},{v:'SWIFT'}],S.outRail,'setOutRail')}</div>
<div class="field"><div class="fieldLabel">Сумма перевода</div><div class="amountwrap"><input type="number" inputmode="decimal" min="0" step="0.01" aria-label="Сумма" value="${esc(S.amount)}" oninput="store('amount',this.value);renderQuote()"/><span>${esc(S.sourceCurrency)}</span></div></div>
<div class="card soft"><div id="quoteBlock">${qSummary()}</div></div>
`;
f=primary('Продолжить','checkConfig()');break;
case'out-recipient':p=`${title('Реквизиты получателя','Перевод физическому лицу. Обязательные банковские поля зависят от выбранного направления.','Шаг 2 / 3')}
<div class="columns2">${field('Имя','firstName','Имя')}${field('Фамилия','lastName','Фамилия')}</div>
${S.outRail==='SEPA'?field('IBAN получателя','iban','DE00 0000 0000 0000 0000 00'):
`${field('Номер счёта / IBAN','account','Account number')}${field('SWIFT / BIC','bic','XXXXXXXXXXX')}${field('Наименование банка','bank','Банк получателя')}`}
${S.outRail==='SWIFT'?`<details class="details"><summary>Дополнительные SWIFT-реквизиты</summary>${field('Банковский / routing код','routing','Если требуется',{optional:true})}${field('Адрес банка','bankAddress','Страна, город, улица',{optional:true})}${field('Адрес получателя','recipientAddress','Страна, город, улица',{optional:true})}${field('Банк-корреспондент','intermediary','Если требуется',{optional:true})}</details>`:`<details class="details"><summary>Дополнительные реквизиты</summary>${field('SWIFT / BIC','bic','Если требуется',{optional:true})}${field('Адрес получателя','recipientAddress','Если требуется',{optional:true})}</details>`}
<div class="field"><div class="fieldLabel">Назначение перевода <span class="req">*</span></div><select class="select" onchange="store('purpose',this.value);render()"><option value="personal" ${S.purpose==='personal'?'selected':''}>Перевод собственных средств</option><option value="family" ${S.purpose==='family'?'selected':''}>Перевод родственникам</option><option value="education" ${S.purpose==='education'?'selected':''}>Обучение</option><option value="other" ${S.purpose==='other'?'selected':''}>Другое</option></select></div>
${S.purpose==='other'?field('Уточнение назначения','purposeOther','Опишите назначение перевода'):''}
`;
f=primary('Проверить перевод','checkRecipient()');break;
case'out-review':p=`${title('Проверьте перевод','Подтвердите сумму, валюту и банковские реквизиты.','Шаг 3 / 3')}
<div class="card">${keyrow('Метод',S.outRail)}${keyrow('ФИО',[S.firstName,S.lastName].filter(Boolean).join(' '))}${keyrow('Страна',COUNTRY[S.country])}${keyrow('Счёт',S.outRail==='SEPA'?S.iban:S.account)}${keyrow('Назначение',purposeName())}</div>
<div class="card"><h3>Расчёт</h3>${qSummary()}</div>`;
f=primary('Подтвердить перевод','checkReview()');break;
case'out-progress':p=`${title('Перевод обрабатывается','Дальнейший статус поступит от платёжного провайдера.','Вывод · Международный перевод')}<span class="status warn">В обработке</span>${timeline('out')}<div class="card"><h3>Информация</h3>${keyrow('Сумма отправления',money(q.amt,S.sourceCurrency))}${keyrow('Получит',money(q.receive,S.outCurrency))}${keyrow('Метод',S.outRail)}${keyrow('Получатель',`${S.firstName} ${S.lastName}`)}</div>${notice('Операция ещё не завершена. Не отправляйте повторно тот же перевод.','warn')}`;f='';break;
case'out-success':p=`<div class="summaryHead"><div class="badgeIcon success">✓</div>${title('Перевод завершён','Банк получателя подтвердил зачисление средств.','Вывод · Международный перевод')}</div><div class="card">${keyrow('Получатель',`${S.firstName} ${S.lastName}`)}${keyrow('Получено',money(q.receive,S.outCurrency))}${keyrow('Метод',S.outRail)}${keyrow('Статус','fund_settled')}</div>`;f=primary('Новый перевод',"go('out-config')");break;
case'out-failed':p=`<div class="summaryHead"><div class="badgeIcon error">!</div>${title('Перевод не выполнен','Операция завершилась ошибкой. Проверьте реквизиты получателя.','Вывод · Международный перевод')}</div><div class="card">${keyrow('Получатель',`${S.firstName} ${S.lastName}`)}${keyrow('Статус','fund_failed')}${keyrow('Причина','Уточняется по API')}</div>${notice('Повторная отправка — только новой операцией.','warn')}`;f=primary('Исправить реквизиты',"go('out-recipient')");break;
case'out-held':p=`<div class="summaryHead"><div class="badgeIcon warn">⋯</div>${title('Перевод на проверке','Дополнительная проверка платёжного провайдера.','Вывод · Международный перевод')}</div><div class="card">${keyrow('Статус','manual_review')}${keyrow('Получатель',`${S.firstName} ${S.lastName}`)}${keyrow('Следующий шаг','Ожидание решения')}</div>${notice('Пока идёт проверка, повторно инициировать перевод нельзя.','warn')}`;f='';break;
case'out-unavailable':p=`<div class="summaryHead"><div class="badgeIcon error">×</div>${title('Перевод недоступен','Для выбранных параметров провайдер не возвращает доступный платёжный маршрут.','Вывод · Международный перевод')}</div><div class="card">${keyrow('Страна',COUNTRY[S.country])}${keyrow('Валюты',`${S.sourceCurrency} → ${S.outCurrency}`)}${keyrow('Метод',S.outRail)}</div>`;f=primary('Изменить параметры',"go('out-config')");break;
}
return {p,f,head,subtitle};}
function purposeName(){return {personal:'Перевод собственных средств',family:'Перевод родственникам',education:'Обучение',other:S.purposeOther||'Другое'}[S.purpose]}
function timeline(flow){const items=flow==='in'?[['done','Отправлено внешним банком','Ожидаем подтверждение'],['current','Проверка поступления','Сопоставление платежа'],['','Зачислено','После проверок']]:[['done','Перевод создан','initiated'],['current','Обрабатывается','fund_processing'],['','Доставлен','fund_settled']];return `<div class="timeline">${items.map(([s,a,b],i)=>`<div class="track ${s}"><div><div class="dot">${s==='done'?'✓':i+1}</div>${i<2?'<div class="line"></div>':''}</div><div><b>${a}</b><small>${b}</small></div></div>`).join('')}</div>`}
function renderQuote(){const t=$('quoteBlock');if(t)t.innerHTML=qSummary()}
function render(){const steps=SCREENS[S.flow];document.querySelectorAll('[data-flow]').forEach(e=>e.classList.toggle('active',e.dataset.flow===S.flow));$('flow-in').classList.toggle('active',S.flow==='in');$('flow-out').classList.toggle('active',S.flow==='out');$('stepList').innerHTML=steps.map(([k,n],i)=>`<button class="stepBtn ${S.screen===k?'active':''}" onclick="go('${k}')"><span class="num">${i+1}</span>${esc(n)}</button>`).join('');$('stageLabel').textContent=S.flow==='in'?'Пополнение · Международный перевод':'Вывод · Международный перевод';$('stageIndex').textContent=(steps.findIndex(([k])=>k===S.screen)+1)+' / '+steps.length;const d=renderScreen();$('phoneTitle').textContent=d.head;$('content').innerHTML=d.p;$('footer').innerHTML=d.f;const m=META[S.screen];$('metaTitle').textContent=m.title;$('metaDescription').textContent=m.desc;$('metaApi').innerHTML=m.apis.map(x=>`<div class="apiChip">${esc(x)}</div>`).join('');$('metaRules').innerHTML=m.rules.map(x=>`<li>${esc(x)}</li>`).join('');const sims=S.flow==='in'?[['Реквизиты', 'in-details'],['Ожидание поступления','in-pending'],['Зачислено','in-success'],['На проверке','in-held']]:[['Параметры','out-config'],['Реквизиты','out-recipient'],['Подтверждение','out-review'],['Обрабатывается','out-progress'],['Успех','out-success'],['Ошибка','out-failed'],['На проверке','out-held'],['Недоступно','out-unavailable']];$('simList').innerHTML=sims.map(([n,k])=>`<button onclick="go('${k}')">${esc(n)}</button>`).join('');$('content').scrollTop=0}
render();
</script>
</body>
</html>
