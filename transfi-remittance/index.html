/* APP SHELL — undo full-screen body locking inherited from alt-vu-wallet.css.
   Native source locks html/body to one phone viewport. This prototype has
   desktop sidebars, a preview frame and a page that must be scrollable.
   Never apply the real app's body/page lifecycle rules to this HTML wrapper. */
html{
  position:static;
  height:auto;
  min-height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior:auto;
}
body{
  position:static;
  top:auto;right:auto;bottom:auto;left:auto;
  width:auto;
  height:auto;
  min-height:100vh;
  overflow:visible;
  overscroll-behavior:auto;
}

/* alt-vu-wallet.css has desktop presentation rules that move every .phone to
   the center of the browser, apply scale(.75) and clip it as a standalone app.
   Keep only native component styles, not this full-page preview transform. */
.phone.tf-phone{
  left:auto;right:auto;top:auto;bottom:auto;
  transform:none;
  clip-path:none;
}
body::before,.phone.tf-phone::after{content:none;display:none}
@media screen and (min-width:1024px) and (min-height:680px){
  .phone.tf-phone{
    position:relative;left:auto;right:auto;top:auto;bottom:auto;
    transform:none;transform-origin:center center;clip-path:none;
    width:430px;max-width:100%;height:932px;margin:0;
    border-radius:32px;
  }
  body::before,.phone.tf-phone::after{content:none;display:none}
}

/* Accessible preview frame: CSS grid children must be allowed to shrink. */

<script>

const CURRENCY=['EUR','USD','GBP'];
const S={flow:'in',screen:'in-details',inCurrency:'EUR',inRail:'SEPA',outCurrency:'EUR',sourceCurrency:'EUR',outRail:'SEPA',country:'DE',amount:'1000',firstName:'',lastName:'',iban:'',account:'',bic:'',bank:'',routing:'',bankAddress:'',recipientAddress:'',intermediary:'',purpose:'personal',purposeOther:'',note:'',showError:false};
const SCREENS={in:[['in-details','Реквизиты'],['in-pending','Поступление ожидается'],['in-success','Зачислено'],['in-held','На проверке']],out:[['out-config','Параметры перевода'],['out-recipient','Реквизиты получателя'],['out-review','Подтверждение'],['out-progress','Обрабатывается'],['out-success','Доставлен'],['out-failed','Ошибка'],['out-held','На проверке'],['out-unavailable','Недоступное направление']]};
const META={
'in-details':{title:'Один экран: валюта → метод → реквизиты',desc:'Без хлебных крошек, подзаголовка и повторяющегося названия внутри блока. Реквизиты меняются сразу под переключателями.',apis:['GET /v3/config/payment-methods/iban','POST /v3/iban','GET /v3/iban (список счетов)'],rules:['Реквизиты выводятся из ответа сервера, а не генерируются клиентом.','SEPA показан только для EUR; входящий SWIFT — демонстрационная гипотеза до подтверждения MID.','Если реквизиты не выданы, показывать состояние недоступности, а не фальшивые реквизиты.']},
'in-pending':{title:'Ожидание входящего перевода',desc:'Статус имеет смысл только для установленного системой входящего платежа. Вручную подтверждать отправку из чужого банка недостаточно.',apis:['Webhook / входящий депозит','GET /v3/iban/balance'],rules:['Состояние обновляется по данным сервера.','Не обещать срок зачисления без данных провайдера.']},
'in-success':{title:'Зачисление',desc:'Деньги доступны после сопоставления депозита и проверок.',apis:['Webhook / статус зачисления','GET /v3/iban/balance'],rules:['Показывать фактическую сумму и валюту.']},
'in-held':{title:'Проверка входящего',desc:'Платёж найден, но ещё не доступен для использования.',apis:['Order matching / compliance','GET /v3/iban/balance'],rules:['Не приравнивать обнаруженный депозит к доступным средствам.']},
'out-config':{title:'Параметры вывода',desc:'На первом шаге сумма и валюты + компактный переключатель SEPA/SWIFT на одном экране.',apis:['GET /v3/config/supported-currencies','GET /v3/config/payment-methods?direction=withdraw','GET /v3/exchange-rates'],rules:['SEPA доступен в демо только при EUR и стране из SEPA-списка.','В боевой версии определять доступность по MID и возвращённым paymentCode.','Курсы и комиссии здесь условные.']},
'out-recipient':{title:'Форма реквизитов физического лица',desc:'Нет переключателя «физлицо / компания» и нет корпоративных полей. Назначение перенесено сюда, чтобы не добавлять отдельный шаг.',apis:['POST /v3/recipients/mandatory-fields','POST /v3/recipients/individual','POST /v3/orders (purposeCode)'],rules:['Обязательные поля зависят от страны, валюты и платёжного метода.','Расширенные SWIFT-поля показаны как условные.','Имена и реквизиты сохраняются при возврате на предыдущий шаг.']},
'out-review':{title:'Проверка перед отправкой',desc:'Метод → ФИО → Страна → Счёт → Назначение → Расчёт. Подтверждение производится кнопкой, без чекбокса.',apis:['GET /v3/exchange-rates','POST /v3/orders'],rules:['Перед реальным созданием заказа обновить quote.','Повторное нажатие не должно создавать второй перевод.']},
'out-progress':{title:'Статус исходящего перевода',desc:'Запрос на перевод принят, но ещё не завершён.',apis:['POST /v3/orders','Webhook / Order status'],rules:['Ответ «заказ создан» не равен «деньги доставлены».','Повторять платеж до терминального статуса нельзя.']},
'out-success':{title:'Деньги получены банком',desc:'Финальное состояние, показываемое только после подтверждённого статуса провайдера.',apis:['fund_settled'],rules:['Квитанция и фактическая сумма поступают с бэкенда.']},
'out-failed':{title:'Неуспешный перевод',desc:'Показывать причину, если она доступна, и возможность изменить реквизиты.',apis:['fund_failed'],rules:['Повтор — новая операция с новым partnerId.']},
'out-held':{title:'Дополнительная проверка',desc:'Операция остаётся в обработке.',apis:['manual_review'],rules:['Не инициировать дублирующий перевод.','Запрашивать документы только при реальном требовании провайдера.']},
'out-unavailable':{title:'Маршрут недоступен',desc:'Показать ограничения выбранной комбинации страны, валюты и платёжного метода.',apis:['GET /v3/config/payment-methods'],rules:['Недоступный маршрут блокирует продолжение.']}
};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t){const n=$('toast');n.textContent=t;n.classList.add('visible');clearTimeout(window._to);window._to=setTimeout(()=>n.classList.remove('visible'),2300)}
function money(x,c){const n=Number(x);return Number.isFinite(n)?new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' '+c:'—'}
function isSepa(){return S.outCurrency==='EUR'&&SEPA_COUNTRIES.includes(S.country)}
function configRail(){if(!isSepa()&&S.outRail==='SEPA')S.outRail='SWIFT'}
function setFlow(f){S.flow=f;S.screen=f==='in'?'in-details':'out-config';S.showError=false;render()}
function go(k){S.screen=k;S.showError=false;render()}
function goBack(){const b={'in-details':null,'in-pending':'in-details','in-success':'in-details','in-held':'in-details','out-config':null,'out-recipient':'out-config','out-review':'out-recipient','out-progress':'out-review','out-success':'out-config','out-failed':'out-recipient','out-held':'out-progress','out-unavailable':'out-config'};if(b[S.screen])go(b[S.screen]);else notify('Возврат в основной раздел приложения находится за пределами этого прототипа')}
function setIncomingCurrency(v){S.inCurrency=v;if(v!=='EUR')S.inRail='SWIFT';render()}
function setIncomingRail(v){if(v==='SEPA'&&S.inCurrency!=='EUR')return;S.inRail=v;render()}
function setOutCurrency(v){S.outCurrency=v;configRail();render()}
function setOutCountry(v){S.country=v;configRail();render()}
function setOutRail(v){if(v==='SEPA'&&!isSepa())return;S.outRail=v;render()}
function setSourceCurrency(v){S.sourceCurrency=v;render()}
function store(k,v){S[k]=v}
function segment(options,selected,fn){return `<div class="seg tf-seg" role="group">${options.map(o=>`<button type="button" class="${o.v===selected?'on':''}" ${o.disabled?'disabled title="Недоступно для выбранных параметров"':''} aria-pressed="${o.v===selected}" onclick="${fn}('${esc(o.v)}')">${esc(o.label??o.v)}</button>`).join('')}</div>`}
function title(text){return `<div class="h2 tf-status-title">${esc(text)}</div>`}
const fieldIcon=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--n850)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M3.5 10h17"/></svg>`;
function field(label,key,placeholder,{optional=false,hint='',type='text'}={}){return `<div class="fld w tf-field" id="wrap-${key}"><div class="fi">${fieldIcon}</div><label class="fl" for="f-${key}"><i>${esc(label)}${optional?' · необязательно':''}</i><input id="f-${key}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(S[key])}" oninput="store('${key}',this.value)" autocomplete="off"/></label></div>`}
function selectField(label,key,opts){return `<div class="fld w tf-field"><div class="fi">${fieldIcon}</div><label class="fl"><i>${esc(label)}</i><select class="tf-select" aria-label="${esc(label)}" onchange="store('${key}',this.value);if('${key}'==='purpose')render()">${opts.map(x=>`<option value="${x[0]}" ${S[key]===x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select></label></div>`}
function keyrow(k,v){return `<div class="rl tf-rl"><span>${esc(k)}</span><b>${esc(v)}</b></div>`}
function notice(text,t=''){return `<div class="tf-notice ${t}">${esc(text)}</div>`}
function primary(t,click,disabled=false){return `<button type="button" class="btn tf-button" ${disabled?'disabled':''} onclick="${click}">${esc(t)}</button>`}
function second(t,click){return `<button type="button" class="btno tf-button" onclick="${click}">${esc(t)}</button>`}
function action(t,click){return second(t,click)}
function getRequisites(){const eur=S.inCurrency==='EUR';const sepa=S.inRail==='SEPA';let rows=[['Получатель','Имя владельца счёта']];if(sepa){rows.push(['IBAN','DE00 0000 0000 0000 0000 00'],['BIC / SWIFT','DEMOXXXX'],['Банк','Банк-партнёр'],['Страна банка','Германия']);}else if(eur){rows.push(['IBAN / номер счёта','DE00 0000 0000 0000 0000 00'],['SWIFT / BIC','DEMOXXXX'],['Банк','Банк-партнёр'],['Адрес банка','Адрес предоставит TransFi']);}else{rows.push(['Номер счёта','000000000000'],['SWIFT / BIC',S.inCurrency==='USD'?'DEMOUS00':'DEMOGB00'],['Банк','Банк-партнёр'],['Адрес банка','Адрес предоставит TransFi']);}rows.push(['Назначение / Reference','DEMO-REF-000123']);return rows}
function copyText(v){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(v).then(()=>notify('Скопировано')).catch(()=>fallbackCopy(v));else fallbackCopy(v)}
function fallbackCopy(v){let e=document.createElement('textarea');e.value=v;document.body.appendChild(e);e.select();let ok=false;try{ok=document.execCommand('copy')}catch{}e.remove();notify(ok?'Скопировано':'Копирование недоступно в этом браузере')}
function copyAll(){copyText(getRequisites().map(([k,v])=>`${k}: ${v}`).join('\n'))}
function copyrow(k,v,i){return `<div class="row tf-copyrow"><div class="rt"><i>${esc(k)}</i><span class="tf-copy-value">${esc(v)}</span></div><button type="button" class="tf-copy" title="Скопировать" aria-label="Скопировать: ${esc(k)}" onclick="copyText(getRequisites()[${i}][1])"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button></div>`}
function numAmount(){return Number(String(S.amount).replace(',','.'))}
function quote(){const amt=numAmount();const valid=Number.isFinite(amt)&&amt>0;const fx=S.sourceCurrency===S.outCurrency?1:({'EURUSD':1.08,'USDEUR':.9259,'EURGBP':.84,'GBPEUR':1.1905,'USDGBP':.7778,'GBPUSD':1.2857})[S.sourceCurrency+S.outCurrency]||1;const fee=S.outRail==='SEPA'?2.5:18;return {valid,amt,fx,fee,receive:Math.max(0,(amt-fee)*fx),min:fee+.01}}
function qSummary(){const q=quote();return `${keyrow('Курс',`1 ${S.sourceCurrency} ≈ ${q.fx.toFixed(4)} ${S.outCurrency}`)}${keyrow('Сумма',money(q.amt,S.sourceCurrency))}${keyrow('Комиссия',money(q.fee,S.sourceCurrency))}${keyrow('Получит',money(q.receive,S.outCurrency))}`}
function validConfig(){const q=quote();return q.valid&&q.amt>q.fee}
function checkConfig(){if(!validConfig()){notify('Укажите сумму больше комиссии');return}go('out-recipient')}
function checkRecipient(){const required=['firstName','lastName',S.outRail==='SEPA'?'iban':'account'];if(S.outRail==='SWIFT')required.push('bic','bank');if(S.purpose==='other')required.push('purposeOther');const missing=required.find(k=>!String(S[k]||'').trim());if(missing){notify('Заполните обязательные поля');const f=$('f-'+missing);f?.scrollIntoView({block:'center',behavior:'smooth'});f?.focus();return}go('out-review')}
function fillDemo(){Object.assign(S,{firstName:'Иван',lastName:'Иванов',iban:'DE00 0000 0000 0000 0000 00',account:'000000000000',bic:'DEMOXXXX',bank:'Банк-партнёр',routing:'',bankAddress:'',recipientAddress:'',intermediary:'',purpose:'personal',purposeOther:'',note:''});render();notify('Заполнены вымышленные тестовые данные')}
function checkReview(){if(!validConfig()){notify('Проверьте сумму перевода');go('out-config');return}go('out-progress')}
function renderScreen(){const q=quote();let p='',f='',head='Международный перевод';switch(S.screen){
case'in-details':{
 const sepaEnabled=S.inCurrency==='EUR';const rows=getRequisites();
 p=`<div class="tf-label">Валюта поступления</div>${segment(CURRENCY.map(v=>({v})),S.inCurrency,'setIncomingCurrency')}

function uxBottomNav(event){
  const target=event.target.closest('[data-mb]');
  if(!target)return;
  event.preventDefault();
  const key=target.dataset.mb;
  if(key==='home')uxGo('home');
  else if(key==='topup')setFlow('in');
  else if(key==='withdraw')setFlow('out');
  else if(key==='card')uxGo('wallet-card');
  else if(key==='profile')uxGo('wallet-profile');
}
function uxHomeNav(event){
  const el=event.target.closest('[data-go]');if(!el)return;
  const route=el.getAttribute('data-go');
  if(route==='topup')setFlow('in');
  else if(route==='withdraw')setFlow('out');
  else if(route==='history')uxGo('history');
  else if(route==='card')uxGo('wallet-card');
  else if(route==='profile')uxGo('wallet-profile');
  else if(route==='earn')uxGo('wallet-earn');
  else if(route==='notes')uxGo('wallet-notes');
  else uxOtherMethod(({card:'Карта',earn:'Партнёрская программа',notes:'Уведомления',support:'Поддержка',profile:'Профиль'})[route]||route);
}
function uxHomeNavKey(e){

  if(e.target.closest('[data-go]')){e.preventDefault();uxHomeNav(e)}
}

function uxSelectMethod(rail) {

  if(S.flow==='in'){
    S.inRail=rail;
    if(rail==='SEPA')S.inCurrency='EUR';
    go('in-details');
  } else {
    S.outRail=rail;
    S.sourceCurrency='USD';
    if(rail==='SEPA'){
      S.outCurrency='EUR';
      if(!SEPA_COUNTRIES.includes(S.country))S.country='DE';
    }
    go('out-config');
  }
}

function uxRender(){
  const phone=document.querySelector('.phone.tf-phone');
  phone.classList.toggle('is-home',S.screen==='home');
  const tabs=document.querySelector('.tf-bottom-nav');
  const showTabs=['home','wallet-card','wallet-profile','wallet-earn','wallet-notes'].includes(S.screen);
  phone.classList.toggle('has-bottom-nav',showTabs);
  tabs.hidden=!showTabs;
  for(const tab of tabs.querySelectorAll('[data-mb]')){
    const key=tab.dataset.mb;
    const selected=(key==='home'&&S.screen==='home')
      ||(key==='card'&&S.screen==='wallet-card')
      ||(key==='profile'&&['wallet-profile','wallet-earn','wallet-notes'].includes(S.screen));
    tab.classList.toggle('on',selected);
    if(selected)tab.setAttribute('aria-current','page');
    else tab.removeAttribute('aria-current');
  }

  _tfBaseRender();
  $('methodLayer').hidden=!S.modal;
  uxRenderMethods();
  document.querySelector('.phone.tf-phone .back').hidden=S.screen==='home';
  const home=$('flow-home');
  if(home)home.classList.toggle('active',S.screen==='home');
  if(S.screen==='home'){
    $('stageLabel').textContent='Главная · Кошелёк alt.vu';
    $('stageIndex').textContent='Главная';
  }else{
    $('stageLabel').textContent=(S.flow==='in'?'Пополнение':'Вывод')+' · '+(S.flow==='in'?S.inRail:S.outRail);
  }
}
