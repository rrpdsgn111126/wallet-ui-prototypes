<body>
<header class="top"><div class="brand">alt.vu <span>/ Международные переводы · прототип</span></div><span class="chip">v8 · компоненты приложения</span></header>
<div class="mobilemenu"><button data-flow="in" onclick="setFlow('in')">Пополнение</button><button data-flow="out" onclick="setFlow('out')">Вывод</button></div>
<div class="proto-shell">
<aside class="sidebar"><div class="sideLabel">Точки входа</div>
<button id="flow-home" class="entry" onclick="go('home')"><span class="glyph">⌂</span><span><b>Главная</b><small>USD-баланс и действия</small></span></button>
<button id="flow-in" class="entry" onclick="setFlow('in')"><span class="glyph">↓</span><span><b>Пополнение</b><small>Международный перевод</small></span></button>
<button id="flow-out" class="entry" onclick="setFlow('out')"><span class="glyph">↑</span><span><b>Вывод</b><small>Международный перевод</small></span></button>
<div class="divider"></div><div class="sideLabel">Экраны</div><div id="stepList"></div></aside>
<main class="workspace"><div class="stage"><span id="stageLabel"></span><span id="stageIndex"></span></div>
<div class="devtools" id="recipientTools" hidden><button class="devFill" type="button" onclick="fillDemo()">Заполнить тестовые реквизиты</button></div>
<div class="phone tf-phone">
<div class="sb"><span>9:41</span><span>●●● ▰</span></div>
<div class="head"><button class="back" aria-label="Назад" onclick="goBack()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button><div class="h1" id="phoneTitle">Международный перевод</div></div>
<div class="tf-scroll" id="content"></div><div class="tf-foot" id="footer"></div><div class="home"></div>
</div></main>
<aside class="apiBox"><div class="sideLabel">Пояснение к экрану</div><h2 id="metaTitle"></h2><p id="metaDescription"></p>
<div class="divider"></div><div class="sideLabel">API / бэкенд</div><div id="metaApi"></div>
<div class="sideLabel">Правила UX</div><ul id="metaRules"></ul><div class="divider"></div>
<div class="sideLabel">Демо-состояния</div><div class="simBtns" id="simList"></div></aside>
</div><div class="alert" id="toast" role="status" aria-live="polite"></div>
<script>
const COUNTRY={DE:'Германия',FR:'Франция',NL:'Нидерланды',GB:'Великобритания',US:'США',ES:'Испания'};
const SEPA_COUNTRIES=['DE','FR','NL','ES'];
const CURRENCY=['EUR','USD','GBP'];
const S={flow:'in',screen:'in-details',inCurrency:'EUR',inRail:'SEPA',outCurrency:'EUR',sourceCurrency:'EUR',outRail:'SEPA',country:'DE',amount:'1000',firstName:'',lastName:'',iban:'',account:'',bic:'',bank:'',routing:'',bankAddress:'',recipientAddress:'',intermediary:'',purpose:'personal',purposeOther:'',note:'',showError:false};
const SCREENS={in:[['in-details','Реквизиты'],['in-pending','Поступление ожидается'],['in-success','Зачислено'],['in-held','На проверке']],out:[['out-config','Параметры перевода'],['out-recipient','Реквизиты получателя'],['out-review','Подтверждение'],['out-progress','Обрабатывается'],['out-success','Доставлен'],['out-failed','Ошибка'],['out-held','На проверке'],['out-unavailable','Недоступное направление']]};
const META={
'in-details':{title:'Один экран: валюта → метод → реквизиты',desc:'Без хлебных крошек, подзаголовка и повторяющегося названия внутри блока. Реквизиты меняются сразу под переключателями.',apis:['GET /v3/config/payment-methods/iban','POST /v3/iban','GET /v3/iban (список счетов)'],rules:['Реквизиты выводятся из ответа сервера, а не генерируются клиентом.','SEPA показан только для EUR; входящий SWIFT — демонстрационная гипотеза до подтверждения MID.','Если реквизиты не выданы, показывать состояние недоступности, а не фальшивые реквизиты.']},
'in-pending':{title:'Ожидание входящего перевода',desc:'Статус имеет смысл только для установленного системой входящего платежа. Вручную подтверждать отправку из чужого банка недостаточно.',apis:['Webhook / входящий депозит','GET /v3/iban/balance'],rules:['Состояние обновляется по данным сервера.','Не обещать срок зачисления без данных провайдера.']},
'in-success':{title:'Зачисление',desc:'Деньги доступны после сопоставления депозита и проверок.',apis:['Webhook / статус зачисления','GET /v3/iban/balance'],rules:['Показывать фактическую сумму и валюту.']},
'in-held':{title:'Проверка входящего',desc:'Платёж найден, но ещё не доступен для использования.',apis:['Order matching / compliance','GET /v3/iban/balance'],rules:['Не приравнивать обнаруженный депозит к доступным средствам.']},
'out-config':{title:'Параметры вывода',desc:'На первом шаге сумма и валюты + компактный переключатель SEPA/SWIFT на одном экране.',apis:['GET /v3/config/supported-currencies','GET /v3/config/payment-methods?direction=withdraw','GET /v3/exchange-rates'],rules:['SEPA доступен в демо только при EUR и стране из SEPA-списка.','В боевой версии определять доступность по MID и возвращённым paymentCode.','Курсы и комиссии здесь условные.']},
'out-recipient':{title:'Форма реквизитов физического лица',desc:'Нет переключателя «физлицо / компания» и нет корпоративных полей. Назначение перенесено сюда, чтобы не добавлять отдельный шаг.',apis:['POST /v3/recipients/mandatory-fields','POST /v3/recipients/individual','POST /v3/orders (purposeCode)'],rules:['Обязательные поля зависят от страны, валюты и платёжного метода.','Расширенные SWIFT-поля показаны как условные.','Имена и реквизиты сохраняются при возврате на предыдущий шаг.']},
'out-review':{title:'Проверка перед отправкой',desc:'Метод → ФИО → Страна → Счёт → Назначение → Расчёт. Подтверждение производится кнопкой, без чекбокса.',apis:['GET /v3/exchange-rates','POST /v3/orders'],rules:['Перед реальным созданием заказа обновить quote.','Повторное нажатие не должно создавать второй перевод.']},
'out-progress':{title:'Статус исходящего перевода',desc:'Запрос на перевод принят, но ещё не завершён.',apis:['POST /v3/orders','Webhook / Order status'],rules:['Ответ «заказ создан» не равен «деньги доставлены».','Повторять платеж до терминального статуса нельзя.']},
'out-success':{title:'Деньги получены банком',desc:'Финальное состояние, показываемое только после подтверждённого статуса провайдера.',apis:['fund_settled'],rules:['Квитанция и фактическая сумма поступают с бэкенда.']},
'out-failed':{title:'Неуспешный перевод',desc:'Показывать причину, если она доступна, и возможность изменить реквизиты.',apis:['fund_failed'],rules:['Повтор — новая операция с новым partnerId.']},
'out-held':{title:'Дополнительная проверка',desc:'Операция остаётся в обработке.',apis:['manual_review'],rules:['Не инициировать дублирующий перевод.','Запрашивать документы только при реальном требовании провайдера.']},
'out-unavailable':{title:'Маршрут недоступен',desc:'Показать ограничения выбранной комбинации страны, валюты и платёжного метода.',apis:['GET /v3/config/payment-methods'],rules:['Недоступный маршрут блокирует продолжение.']}
};
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t){const n=$('toast');n.textContent=t;n.classList.add('visible');clearTimeout(window._to);window._to=setTimeout(()=>n.classList.remove('visible'),2300)}
function money(x,c){const n=Number(x);return Number.isFinite(n)?new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' '+c:'—'}
function isSepa(){return S.outCurrency==='EUR'&&SEPA_COUNTRIES.includes(S.country)}
function configRail(){if(!isSepa()&&S.outRail==='SEPA')S.outRail='SWIFT'}
function setFlow(f){S.flow=f;S.screen=f==='in'?'in-details':'out-config';S.showError=false;render()}
function go(k){S.screen=k;S.showError=false;render()}
function goBack(){const b={'in-details':null,'in-pending':'in-details','in-success':'in-details','in-held':'in-details','out-config':null,'out-recipient':'out-config','out-review':'out-recipient','out-progress':'out-review','out-success':'out-config','out-failed':'out-recipient','out-held':'out-progress','out-unavailable':'out-config'};if(b[S.screen])go(b[S.screen]);else notify('Возврат в основной раздел приложения находится за пределами этого прототипа')}
function setIncomingCurrency(v){S.inCurrency=v;if(v!=='EUR')S.inRail='SWIFT';render()}
function setIncomingRail(v){if(v==='SEPA'&&S.inCurrency!=='EUR')return;S.inRail=v;render()}
function setOutCurrency(v){S.outCurrency=v;configRail();render()}
function setOutCountry(v){S.country=v;configRail();render()}
function setOutRail(v){if(v==='SEPA'&&!isSepa())return;S.outRail=v;render()}
function setSourceCurrency(v){S.sourceCurrency=v;render()}
function store(k,v){S[k]=v}
function segment(options,selected,fn){return `<div class="seg tf-seg" role="group">${options.map(o=>`<button type="button" class="${o.v===selected?'on':''}" ${o.disabled?'disabled title="Недоступно для выбранных параметров"':''} aria-pressed="${o.v===selected}" onclick="${fn}('${esc(o.v)}')">${esc(o.label??o.v)}</button>`).join('')}</div>`}
function title(text){return `<div class="h2 tf-status-title">${esc(text)}</div>`}
const fieldIcon=`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--n850)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M3.5 10h17"/></svg>`;
function field(label,key,placeholder,{optional=false,hint='',type='text'}={}){return `<div class="fld w tf-field" id="wrap-${key}"><div class="fi">${fieldIcon}</div><label class="fl" for="f-${key}"><i>${esc(label)}${optional?' · необязательно':''}</i><input id="f-${key}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(S[key])}" oninput="store('${key}',this.value)" autocomplete="off"/></label></div>`}
function selectField(label,key,opts){return `<div class="fld w tf-field"><div class="fi">${fieldIcon}</div><label class="fl"><i>${esc(label)}</i><select class="tf-select" aria-label="${esc(label)}" onchange="store('${key}',this.value);if('${key}'==='purpose')render()">${opts.map(x=>`<option value="${x[0]}" ${S[key]===x[0]?'selected':''}>${esc(x[1])}</option>`).join('')}</select></label></div>`}
function keyrow(k,v){return `<div class="rl tf-rl"><span>${esc(k)}</span><b>${esc(v)}</b></div>`}
function notice(text,t=''){return `<div class="tf-notice ${t}">${esc(text)}</div>`}
function primary(t,click,disabled=false){return `<button type="button" class="btn tf-button" ${disabled?'disabled':''} onclick="${click}">${esc(t)}</button>`}
function second(t,click){return `<button type="button" class="btno tf-button" onclick="${click}">${esc(t)}</button>`}
function action(t,click){return second(t,click)}
function getRequisites(){const eur=S.inCurrency==='EUR';const sepa=S.inRail==='SEPA';let rows=[['Получатель','Имя владельца счёта']];if(sepa){rows.push(['IBAN','DE00 0000 0000 0000 0000 00'],['BIC / SWIFT','DEMOXXXX'],['Банк','Банк-партнёр'],['Страна банка','Германия']);}else if(eur){rows.push(['IBAN / номер счёта','DE00 0000 0000 0000 0000 00'],['SWIFT / BIC','DEMOXXXX'],['Банк','Банк-партнёр'],['Адрес банка','Адрес предоставит TransFi']);}else{rows.push(['Номер счёта','000000000000'],['SWIFT / BIC',S.inCurrency==='USD'?'DEMOUS00':'DEMOGB00'],['Банк','Банк-партнёр'],['Адрес банка','Адрес предоставит TransFi']);}rows.push(['Назначение / Reference','DEMO-REF-000123']);return rows}
function copyText(v){if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(v).then(()=>notify('Скопировано')).catch(()=>fallbackCopy(v));else fallbackCopy(v)}
function fallbackCopy(v){let e=document.createElement('textarea');e.value=v;document.body.appendChild(e);e.select();let ok=false;try{ok=document.execCommand('copy')}catch{}e.remove();notify(ok?'Скопировано':'Копирование недоступно в этом браузере')}
function copyAll(){copyText(getRequisites().map(([k,v])=>`${k}: ${v}`).join('\n'))}
function copyrow(k,v,i){return `<div class="row tf-copyrow"><div class="rt"><i>${esc(k)}</i><span class="tf-copy-value">${esc(v)}</span></div><button type="button" class="tf-copy" title="Скопировать" aria-label="Скопировать: ${esc(k)}" onclick="copyText(getRequisites()[${i}][1])"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button></div>`}
function numAmount(){return Number(String(S.amount).replace(',','.'))}
function quote(){const amt=numAmount();const valid=Number.isFinite(amt)&&amt>0;const fx=S.sourceCurrency===S.outCurrency?1:({'EURUSD':1.08,'USDEUR':.9259,'EURGBP':.84,'GBPEUR':1.1905,'USDGBP':.7778,'GBPUSD':1.2857})[S.sourceCurrency+S.outCurrency]||1;const fee=S.outRail==='SEPA'?2.5:18;return {valid,amt,fx,fee,receive:Math.max(0,(amt-fee)*fx),min:fee+.01}}
function qSummary(){const q=quote();return `${keyrow('Курс',`1 ${S.sourceCurrency} ≈ ${q.fx.toFixed(4)} ${S.outCurrency}`)}${keyrow('Сумма',money(q.amt,S.sourceCurrency))}${keyrow('Комиссия',money(q.fee,S.sourceCurrency))}${keyrow('Получит',money(q.receive,S.outCurrency))}`}
function validConfig(){const q=quote();return q.valid&&q.amt>q.fee}
function checkConfig(){if(!validConfig()){notify('Укажите сумму больше комиссии');return}go('out-recipient')}
function checkRecipient(){const required=['firstName','lastName',S.outRail==='SEPA'?'iban':'account'];if(S.outRail==='SWIFT')required.push('bic','bank');if(S.purpose==='other')required.push('purposeOther');const missing=required.find(k=>!String(S[k]||'').trim());if(missing){notify('Заполните обязательные поля');const f=$('f-'+missing);f?.scrollIntoView({block:'center',behavior:'smooth'});f?.focus();return}go('out-review')}
function fillDemo(){Object.assign(S,{firstName:'Иван',lastName:'Иванов',iban:'DE00 0000 0000 0000 0000 00',account:'000000000000',bic:'DEMOXXXX',bank:'Банк-партнёр',routing:'',bankAddress:'',recipientAddress:'',intermediary:'',purpose:'personal',purposeOther:'',note:''});render();notify('Заполнены вымышленные тестовые данные')}
function checkReview(){if(!validConfig()){notify('Проверьте сумму перевода');go('out-config');return}go('out-progress')}
function renderScreen(){const q=quote();let p='',f='',head='Международный перевод';switch(S.screen){
case'in-details':{
 const sepaEnabled=S.inCurrency==='EUR';const rows=getRequisites();
 p=`<div class="tf-label">Валюта поступления</div>${segment(CURRENCY.map(v=>({v})),S.inCurrency,'setIncomingCurrency')}
 <div class="tf-label">Способ перевода</div>${segment([{v:'SEPA',disabled:!sepaEnabled},{v:'SWIFT'}],S.inRail,'setIncomingRail')}
 <div class="box tf-requisites">${rows.map(([k,v],i)=>copyrow(k,v,i)).join('')}</div>`;
 f=primary('Скопировать все реквизиты','copyAll()');break;}
case'in-pending':p=`<div class="tf-hero"><div class="tf-mark pending">◷</div>${title('Ожидаем поступление')}<p>Платёж отобразится после подтверждения банка</p></div>${timeline('in')}`;f=action('Вернуться к реквизитам',"go('in-details')");break;
case'in-success':p=`<div class="hero tf-hero"><div class="okc">✓</div>${title('Деньги зачислены')}</div><div class="tbl">${keyrow('Валюта',S.inCurrency)}${keyrow('Сумма','По факту зачисления')}${keyrow('Статус','Завершено')}</div>`;f=primary('К реквизитам',"go('in-details')");break;
case'in-held':p=`<div class="tf-hero"><div class="tf-mark pending">⋯</div>${title('Поступление на проверке')}<p>Средства пока недоступны для использования</p></div><div class="tbl">${keyrow('Валюта',S.inCurrency)}${keyrow('Статус','На проверке')}</div>`;f=primary('К реквизитам',"go('in-details')");break;
case'out-config':p=`
<div class="tf-label">Валюта списания</div>${segment(CURRENCY.map(v=>({v})),S.sourceCurrency,'setSourceCurrency')}
<div class="tf-label">Валюта получения</div>${segment(CURRENCY.map(v=>({v})),S.outCurrency,'setOutCurrency')}
<div class="fld w tf-field"><div class="fi">${fieldIcon}</div><label class="fl"><i>Страна получателя</i><select class="tf-select" aria-label="Страна получателя" onchange="setOutCountry(this.value)">${Object.entries(COUNTRY).map(([c,name])=>`<option value="${c}" ${S.country===c?'selected':''}>${esc(name)}</option>`).join('')}</select></label></div>
<div class="tf-label">Способ перевода</div>${segment([{v:'SEPA',disabled:!isSepa()},{v:'SWIFT'}],S.outRail,'setOutRail')}
<div class="fld w tf-field tf-amount"><div class="fi">${fieldIcon}</div><label class="fl"><i>Сумма перевода</i><input type="number" min="0" step="0.01" inputmode="decimal" aria-label="Сумма перевода" value="${esc(S.amount)}" oninput="store('amount',this.value);renderQuote()"/></label><div class="addon"><span class="cur">${esc(S.sourceCurrency)}</span></div></div>
<div class="tbl tf-quote" id="quoteBlock">${qSummary()}</div>`;
f=primary('Продолжить','checkConfig()');break;
case'out-recipient':p=`${field('Имя','firstName','Имя')}${field('Фамилия','lastName','Фамилия')}
${S.outRail==='SEPA'?field('IBAN получателя','iban','DE00 0000 0000 0000 0000 00'):
`${field('Номер счёта / IBAN','account','Номер счёта')}${field('SWIFT / BIC','bic','XXXXXXXXXXX')}${field('Наименование банка','bank','Банк получателя')}`}
${S.outRail==='SWIFT'?`<details class="tf-more"><summary>Дополнительные SWIFT-реквизиты</summary>${field('Банковский / routing код','routing','Если требуется',{optional:true})}${field('Адрес банка','bankAddress','Страна, город, улица',{optional:true})}${field('Адрес получателя','recipientAddress','Страна, город, улица',{optional:true})}${field('Банк-корреспондент','intermediary','Если требуется',{optional:true})}</details>`:`<details class="tf-more"><summary>Дополнительные реквизиты</summary>${field('SWIFT / BIC','bic','Если требуется',{optional:true})}${field('Адрес получателя','recipientAddress','Если требуется',{optional:true})}</details>`}
${selectField('Назначение перевода','purpose',[['personal','Перевод собственных средств'],['family','Перевод родственникам'],['education','Обучение'],['other','Другое']])}
${S.purpose==='other'?field('Уточнение назначения','purposeOther','Опишите назначение перевода'):''}`;
f=primary('Проверить перевод','checkRecipient()');break;
case'out-review':p=`<div class="tbl">${keyrow('Метод',S.outRail)}${keyrow('ФИО',[S.firstName,S.lastName].filter(Boolean).join(' '))}${keyrow('Страна',COUNTRY[S.country])}${keyrow('Счёт',S.outRail==='SEPA'?S.iban:S.account)}${keyrow('Назначение',purposeName())}</div>
<div class="tf-label">Расчёт</div><div class="tbl tf-quote">${qSummary()}</div>`;
f=primary('Подтвердить перевод','checkReview()');break;
case'out-progress':p=`<div class="tf-hero"><div class="tf-mark pending">◷</div>${title('Перевод обрабатывается')}<p>Ожидаем подтверждение платёжного провайдера</p></div>${timeline('out')}<div class="tbl">${keyrow('Сумма',money(q.amt,S.sourceCurrency))}${keyrow('Получит',money(q.receive,S.outCurrency))}${keyrow('Метод',S.outRail)}</div>`;f='';break;
case'out-success':p=`<div class="hero tf-hero"><div class="okc">✓</div>${title('Перевод завершён')}</div><div class="tbl">${keyrow('Получатель',`${S.firstName} ${S.lastName}`)}${keyrow('Получит',money(q.receive,S.outCurrency))}${keyrow('Метод',S.outRail)}</div>`;f=primary('Новый перевод',"go('out-config')");break;
case'out-failed':p=`<div class="tf-hero"><div class="tf-mark failed">×</div>${title('Перевод не выполнен')}<p>Проверьте реквизиты получателя</p></div><div class="tbl">${keyrow('Получатель',`${S.firstName} ${S.lastName}`)}${keyrow('Статус','Ошибка операции')}</div>`;f=primary('Исправить реквизиты',"go('out-recipient')");break;
case'out-held':p=`<div class="tf-hero"><div class="tf-mark pending">⋯</div>${title('Перевод на проверке')}<p>Ожидаем решение платёжного провайдера</p></div><div class="tbl">${keyrow('Статус','На проверке')}${keyrow('Получатель',`${S.firstName} ${S.lastName}`)}</div>`;f='';break;
case'out-unavailable':p=`<div class="tf-hero"><div class="tf-mark failed">×</div>${title('Перевод недоступен')}<p>Для выбранного направления нет доступного метода</p></div><div class="tbl">${keyrow('Страна',COUNTRY[S.country])}${keyrow('Валюты',`${S.sourceCurrency} → ${S.outCurrency}`)}${keyrow('Метод',S.outRail)}</div>`;f=primary('Изменить параметры',"go('out-config')");break;
}
return {p,f,head};}
function purposeName(){return {personal:'Перевод собственных средств',family:'Перевод родственникам',education:'Обучение',other:S.purposeOther||'Другое'}[S.purpose]}
function timeline(flow){const items=flow==='in'?[['done','Отправлено внешним банком','Ожидаем подтверждение'],['current','Проверка поступления','Сопоставление платежа'],['','Зачислено','После проверок']]:[['done','Перевод создан','initiated'],['current','Обрабатывается','fund_processing'],['','Доставлен','fund_settled']];return `<div class="timeline">${items.map(([s,a,b],i)=>`<div class="track ${s}"><div><div class="dot">${s==='done'?'✓':i+1}</div>${i<2?'<div class="line"></div>':''}</div><div><b>${a}</b><small>${b}</small></div></div>`).join('')}</div>`}
function renderQuote(){const t=$('quoteBlock');if(t)t.innerHTML=qSummary()}
function render(){const steps=SCREENS[S.flow];document.querySelectorAll('[data-flow]').forEach(e=>e.classList.toggle('active',e.dataset.flow===S.flow));$('flow-in').classList.toggle('active',S.flow==='in');$('flow-out').classList.toggle('active',S.flow==='out');$('stepList').innerHTML=steps.map(([k,n],i)=>`<button class="stepBtn ${S.screen===k?'active':''}" onclick="go('${k}')"><span class="num">${i+1}</span>${esc(n)}</button>`).join('');$('stageLabel').textContent=S.flow==='in'?'Пополнение · Международный перевод':'Вывод · Международный перевод';$('stageIndex').textContent=(steps.findIndex(([k])=>k===S.screen)+1)+' / '+steps.length;$('recipientTools').hidden=S.screen!=='out-recipient';const d=renderScreen();$('phoneTitle').textContent=d.head;$('content').innerHTML=d.p;$('footer').innerHTML=d.f;const m=META[S.screen];$('metaTitle').textContent=m.title;$('metaDescription').textContent=m.desc;$('metaApi').innerHTML=m.apis.map(x=>`<div class="apiChip">${esc(x)}</div>`).join('');$('metaRules').innerHTML=m.rules.map(x=>`<li>${esc(x)}</li>`).join('');const sims=S.flow==='in'?[['Реквизиты', 'in-details'],['Ожидание поступления','in-pending'],['Зачислено','in-success'],['На проверке','in-held']]:[['Параметры','out-config'],['Реквизиты','out-recipient'],['Подтверждение','out-review'],['Обрабатывается','out-progress'],['Успех','out-success'],['Ошибка','out-failed'],['На проверке','out-held'],['Недоступно','out-unavailable']];$('simList').innerHTML=sims.map(([n,k])=>`<button onclick="go('${k}')">${esc(n)}</button>`).join('');$('content').scrollTop=0}
function uxSelectMethod(rail) {
  if(!['SEPA','SWIFT'].includes(rail))return;
  if(S.flow==='in'){
    S.inRail=rail;
    if(rail==='SEPA')S.inCurrency='EUR';
    go('in-details');
  } else {
    S.outRail=rail;
    S.sourceCurrency='USD';
    if(rail==='SEPA'){
      S.outCurrency='EUR';
      if(!SEPA_COUNTRIES.includes(S.country))S.country='DE';
    }
    go('out-config');
  }
}

function uxOtherMethod(name){
  notify('Раздел '+name+' существует в alt.vu, но не входит в этот TransFi-прототип');
}

function uxMethodRow(name,description,symbol,handler){
  return `<button type="button" class="tf-method-row" onclick="${handler}"><span class="tf-method-icon" aria-hidden="true">${esc(symbol)}</span><span class="tf-method-details"><b>${esc(name)}</b><small>${esc(description)}</small></span><span class="tf-method-chevron" aria-hidden="true">›</span></button>`;
}

function uxRenderMethods(){
  const layer=$('methodLayer');
  if(!S.modal){layer.hidden=true;layer.innerHTML='';return}
  const isIn=S.modal==='in';
  const rails=uxMethodRow('SEPA','Банковский перевод в евро','€',"uxSelectMethod('SEPA')")+uxMethodRow('SWIFT','Международный банковский перевод','↗',"uxSelectMethod('SWIFT')");
  const other=isIn?[
    ['СБП','Банковское пополнение в рублях','₽'],
    ['USDT','Пополнение в криптовалюте','₮'],
    ['USDC','Пополнение в криптовалюте','$'],
    ['ALT.VU','От другого пользователя alt.vu','A']
  ]:[
    ['USDT','Вывод в криптовалюте','₮'],
    ['USDC','Вывод в криптовалюте','$'],
    ['ALT.VU','Перевод пользователю alt.vu','A']
  ];
  layer.innerHTML=`<button type="button" class="tf-method-dim" aria-label="Закрыть выбор способа" onclick="uxCloseMethods()"></button>
    <section class="tf-method-sheet" role="dialog" aria-modal="true" aria-labelledby="tfMethodTitle">
    <div class="tf-method-grab"></div><h2 class="tf-method-title" id="tfMethodTitle">${isIn?'Пополнить':'Вывести'}</h2>
    <div class="tf-method-group">Банковский перевод</div>${rails}
    <div class="tf-method-group">Другие способы</div>
    ${other.map(([a,b,c])=>uxMethodRow(a,b,c,`uxOtherMethod('${a}')`)).join('')}
    </section>`;
  layer.hidden=false;
}

function uxCloseMethods(){S.modal=null;render()}

function uxSetFlow(flow){S.flow=flow;S.screen='home';S.modal=flow;S.showError=false;render()}

function uxGo(screen){S.screen=screen;S.modal=null;S.showError=false;render()}

function uxBack(){
  if(S.modal){uxCloseMethods();return}
  if(S.screen==='in-details'){S.screen='home';S.modal='in';render();return}
  if(S.screen==='out-config'){S.screen='home';S.modal='out';render();return}
  const map={
    'in-pending':'in-details','in-success':'in-details','in-held':'in-details',
    'out-recipient':'out-config','out-review':'out-recipient','out-progress':'out-review',
    'out-success':'out-config','out-failed':'out-recipient','out-held':'out-progress','out-unavailable':'out-config'
  };
  if(map[S.screen])uxGo(map[S.screen]);else uxGo('home');
}

function uxSetIncomingCurrency(currency){
  const available=S.inRail==='SEPA'?['EUR']:CURRENCY;
  if(!available.includes(currency))return;
  S.inCurrency=currency;render();
}

function uxSetOutCurrency(currency){
  if(S.outRail==='SEPA'&&currency!=='EUR')return;
  S.outCurrency=currency;render();
}

function uxSetOutCountry(country){
  if(S.outRail==='SEPA'&&!SEPA_COUNTRIES.includes(country))return;
  S.country=country;render();
}

function uxRenderScreen(){
  if(S.screen==='home')return {
    head:'Кошелёк',
    p:`<div class="tf-home-summary"><p class="tf-home-caption">Общий баланс</p><div class="tf-home-amount">1 250,00 USD</div></div>
    <div class="tf-home-actions">
      <button type="button" class="tf-home-action primary" onclick="setFlow('in')"><span class="tf-home-arrow">↓</span>Пополнить</button>
      <button type="button" class="tf-home-action" onclick="setFlow('out')"><span class="tf-home-arrow">↑</span>Вывести</button>
    </div><div class="tf-label">История операций</div><div class="box"><div class="tf-home-empty">Операций пока нет</div></div>`,
    f:''
  };
  if(S.screen==='in-details'){
    const rows=getRequisites();
    const currencyControl=S.inRail==='SEPA'
      ? `<div class="fld w tf-field tf-deposit-currency"><div class="fi">${fieldIcon}</div><div class="fl"><i>Валюта пополнения</i><b>EUR</b></div></div>`
      : `<div class="fld w tf-field tf-deposit-currency"><div class="fi">${fieldIcon}</div><label class="fl"><i>Валюта пополнения</i><select class="tf-select" aria-label="Валюта пополнения" onchange="setIncomingCurrency(this.value)">${CURRENCY.map(c=>`<option value="${c}" ${S.inCurrency===c?'selected':''}>${c}</option>`).join('')}</select></label></div>`;
    return {
      head:'Пополнение · '+S.inRail,
      p:`${currencyControl}<div class="box tf-requisites">${rows.map(([k,v],i)=>copyrow(k,v,i)).join('')}</div>`,
      f:primary('Скопировать все реквизиты','copyAll()')
    };
  }
  if(S.screen==='out-config'){
    const q=quote();
    const currencies=S.outRail==='SEPA'?['EUR']:CURRENCY;
    const countries=S.outRail==='SEPA'?Object.entries(COUNTRY).filter(([code])=>SEPA_COUNTRIES.includes(code)):Object.entries(COUNTRY);
    return{
      head:'Вывод · '+S.outRail,
      p:`<div class="tf-route"><strong>${esc(S.outRail)}</strong>Банковский перевод</div>
      <div class="tf-label">Списать с баланса</div><div class="tf-static-source"><span>Валюта баланса</span><strong>USD</strong></div>
      <div class="tf-label">Валюта получения</div>${segment(currencies.map(v=>({v})),S.outCurrency,'setOutCurrency')}
      <div class="fld w tf-field"><div class="fi">${fieldIcon}</div><label class="fl"><i>Страна получателя</i><select class="tf-select" aria-label="Страна получателя" onchange="setOutCountry(this.value)">${countries.map(([c,name])=>`<option value="${c}" ${S.country===c?'selected':''}>${esc(name)}</option>`).join('')}</select></label></div>
      <div class="fld w tf-field tf-amount"><div class="fi">${fieldIcon}</div><label class="fl"><i>Сумма перевода</i><input type="number" min="0" step="0.01" inputmode="decimal" aria-label="Сумма перевода" value="${esc(S.amount)}" oninput="store('amount',this.value);renderQuote()"/></label><div class="addon"><span class="cur">USD</span></div></div>
      <div class="tbl tf-quote" id="quoteBlock">${qSummary()}</div>`,
      f:primary('Продолжить','checkConfig()')
    };
  }
  const old=_tfBaseRenderScreen();
  if(S.flow==='out')old.head='Вывод · '+S.outRail;
  if(S.flow==='in')old.head='Пополнение · '+S.inRail;
  return old;
}

function uxRender(){
  _tfBaseRender();
  $('methodLayer').hidden=!S.modal;
  uxRenderMethods();
  document.querySelector('.phone.tf-phone .back').hidden=S.screen==='home';
  const home=$('flow-home');
  if(home)home.classList.toggle('active',S.screen==='home');
  if(S.screen==='home'){
    $('stageLabel').textContent='Главная · Кошелёк alt.vu';
    $('stageIndex').textContent='Главная';
  }else{
    $('stageLabel').textContent=(S.flow==='in'?'Пополнение':'Вывод')+' · '+(S.flow==='in'?S.inRail:S.outRail);
  }
}
const _tfBaseRender=render;
const _tfBaseRenderScreen=renderScreen;
S.screen='home';
S.modal=null;
S.sourceCurrency='USD';
S.inRail='SEPA';
S.inCurrency='EUR';
S.outRail='SEPA';
S.outCurrency='EUR';
META.home={title:'Главная кошелька',desc:'Один общий USD-баланс, вход в пополнение и вывод через шторку. Баланс в прототипе условный.',apis:[],rules:['Все пополнения и выводы требуют KYC в основном приложении.','СБП, USDT/USDC и внутренние переводы не заменяются.']};
META['in-details']={title:'Валюта пополнения и банковские реквизиты',desc:'На одном экране: для SEPA валютой фиксирован EUR, для SWIFT валюта выбирается в поле над реквизитами. При смене SWIFT-валюты реквизиты перестраиваются без перехода.',apis:['GET /v3/config/supported-currencies','GET /v3/config/payment-methods/iban','GET /v3/iban'],rules:['Доступные валюты и реквизиты в прототипе демонстрационные и зависят от merchant/MID.','Копирование банковских реквизитов не означает отправку или обнаружение платежа.','При смене валюты показывается набор реквизитов выбранной валюты.']};
const methodLayer=document.createElement('div');
methodLayer.id='methodLayer';
methodLayer.className='tf-method-layer';
methodLayer.hidden=true;
document.querySelector('.phone.tf-phone').appendChild(methodLayer);
setFlow=uxSetFlow;
go=uxGo;
goBack=uxBack;
setIncomingCurrency=uxSetIncomingCurrency;
setOutCurrency=uxSetOutCurrency;
setOutCountry=uxSetOutCountry;
renderScreen=uxRenderScreen;
render=uxRender;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)uxCloseMethods()});

render();
</script>
</body></html>
