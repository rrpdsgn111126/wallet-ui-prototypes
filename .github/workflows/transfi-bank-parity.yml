name: Bank visual parity vs alt.vu source
on:
  push:
    branches: [main]
    paths:
      - 'transfi-remittance/legacy.html'
      - 'css/transfi-bank-altvu.css'
      - 'tests/bank-parity.mjs'
      - '.github/workflows/transfi-bank-parity.yml'
  workflow_dispatch:
concurrency:
  group: bank-parity-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Compare SEPA/SWIFT elements to source and capture screens
        id: audit
        continue-on-error: true
        run: node tests/bank-parity.mjs
      - name: Publish visual QA screenshots and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/bank-qa/output
          if ! git diff --cached --quiet; then
            git commit -m "Update SEPA/SWIFT visual parity screenshots"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bank-source-parity
          path: tests/bank-qa/output
          if-no-files-found: warn
      - name: Fail for visual discrepancies or broken transitions
        if: steps.audit.outcome == 'failure'
        run: exit 1
