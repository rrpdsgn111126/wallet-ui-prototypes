name: Alt.vu source HTML parity
on:
  push:
    branches: [main]
    paths:
      - 'transfi-remittance/index.html'
      - 'transfi-remittance/legacy.html'
      - 'tests/source-smoke.mjs'
      - '.github/workflows/transfi-source-playwright.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Check native source markup and TransFi links
        run: node tests/source-smoke.mjs
      - name: Publish inspected screenshots for review
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/source-output
          if ! git diff --cached --quiet; then
            git commit -m "Capture original alt.vu source UI for visual parity review"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
      - name: Upload captured original screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alt-vu-source-screens
          path: tests/source-output
          if-no-files-found: warn
