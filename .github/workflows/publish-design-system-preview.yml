name: Publish isolated design-system preview

on:
  push:
    branches: [work/design-system]
    paths:
      - 'assets/**'
      - 'components/**'
      - 'css/**'
      - 'sheet/**'
      - 'showcase/**'
      - 'tokens/**'
      - 'transfi-remittance/**'
      - 'ui-kit/**'
      - '.github/workflows/publish-design-system-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: design-system-static-preview
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Copy working branch into separate Pages preview folder
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/preview-main" origin/main
          PREVIEW="$RUNNER_TEMP/preview-main/preview/design-system"
          mkdir -p "$PREVIEW"
          for dir in assets components css sheet showcase tokens transfi-remittance ui-kit; do
            mkdir -p "$PREVIEW/$dir"
            rsync -a --checksum --delete "$dir/" "$PREVIEW/$dir/"
          done
          # Same-length color edits are common; verify that the copied files match byte for byte.
          for file in css/alt-vu-wallet.css css/transfi-bank-altvu.css css/design-system.css \
                      tokens/tokens.css tokens/tokens.json \
                      transfi-remittance/index.html transfi-remittance/legacy.html ui-kit/index.html; do
            cmp "$file" "$PREVIEW/$file"
          done
          cat > "$PREVIEW/index.html" <<'HTML'
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>alt.vu — предпросмотр дизайн-системы</title><style>body{font-family:Inter,system-ui,sans-serif;color:#161514;background:#f6f7f8;margin:0;padding:40px 20px}main{max-width:680px;margin:auto}h1{font-size:28px}p{font-size:15px;line-height:1.6;color:#555}a{display:block;text-decoration:none;color:#161514;padding:22px 24px;background:white;border:1px solid #ddd;border-radius:16px;margin:12px 0;font-weight:600}a:hover{border-color:#12833a}small{display:block;color:#666;font-weight:400;margin-top:7px}</style></head><body><main><p>alt.vu / work/design-system</p><h1>Предпросмотр дизайн-системы</h1><p>Изолированная сборка из рабочей ветки. Основной прототип не изменяется.</p><a href="./transfi-remittance/">Тестовый прототип<small>Проверка токенов в рабочих экранах</small></a><a href="./ui-kit/">UI Kit<small>Библиотека компонентов и их состояний</small></a><a href="./tokens/tokens.css">Токены<small>Цвета и типографика</small></a></main></body></html>
          HTML
          cd "$RUNNER_TEMP/preview-main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/design-system
          if git diff --cached --quiet; then
            echo "Preview already up to date."
            exit 0
          fi
          git commit -m "deploy(preview): sync isolated design-system build"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Published the preview without merging source changes."
              exit 0
            fi
            echo "Retry $attempt after concurrent main update"
            sleep 3
          done
          echo "Unable to publish preview after retries" >&2
          exit 1
