name: Selector-style method sheet QA

on:
  push:
    branches: [work/design-system]
    paths:
      - 'css/design-system.css'
      - 'components/sheet.html'
      - 'ui-kit/index.html'
      - 'transfi-remittance/index.html'
      - 'tests/design-system/method-sheet.mjs'
      - '.github/workflows/method-sheet-qa.yml'
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright (system Chrome)
        run: npm install --no-save playwright@1.56.1
      - name: Check sample, themes, and real top-up/withdraw flows
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/method-sheet-server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          node tests/design-system/method-sheet.mjs http://127.0.0.1:8765
      - name: Upload light and dark screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: method-sheet-light-dark
          path: ${{ runner.temp }}/method-sheet/
          if-no-files-found: warn
