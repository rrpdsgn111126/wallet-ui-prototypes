name: Design system normalization QA
on:
  push:
    branches: [design-system-normalization, work/design-system, main]
    paths:
      - 'tokens/**'
      - 'css/**'
      - 'components/**'
      - 'showcase/**'
      - 'ui-kit/**'
      - 'transfi-remittance/**'
      - 'build/build.py'
      - 'tests/design-system/**'
      - '.github/workflows/design-system-qa.yml'
  workflow_dispatch:
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Playwright, PNG comparison utilities
        run: |
          npm install --no-save playwright@1.56.1 pngjs@7.0.0 pixelmatch@5.3.0
      - name: Verify Python build syntax
        run: python -m py_compile build/build.py
      - name: Checkout immutable design-system baseline
        run: git worktree add --detach "$RUNNER_TEMP/ds-baseline" a4a93e0ff24dd5d1fdbc5c53413d06bce600c57b
      - name: Audit normalized font sizes against baseline
        run: node tests/design-system/typography-audit.mjs "$RUNNER_TEMP/ds-baseline" "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/typography-audit.json"
      - name: Compare baseline and verify live tokens
        run: node tests/design-system/qa.mjs "$RUNNER_TEMP/ds-baseline" "$GITHUB_WORKSPACE"
      - name: Verify typography inspector at 390, 430 and 1440px
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/ds-03-http.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          node tests/design-system/ui-kit-typography.mjs http://127.0.0.1:8765/ui-kit/
          node tests/design-system/font-weight-audit.mjs http://127.0.0.1:8765/ui-kit/ "$RUNNER_TEMP/font-weight-audit.json"
      - name: Upload before/after and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-system-typography-audit
          path: |
            ${{ runner.temp }}/ds-02-visual-diff/
            ${{ runner.temp }}/typography-audit.json
            ${{ runner.temp }}/font-weight-audit.json
            ${{ runner.temp }}/ds-03-typography/
          if-no-files-found: warn
