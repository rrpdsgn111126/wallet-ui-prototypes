name: Publish isolated prototype preview

on:
  push:
    branches: [work/prototype]
    paths:
      - 'assets/**'
      - 'components/**'
      - 'css/**'
      - 'sheet/**'
      - 'showcase/**'
      - 'tokens/**'
      - 'transfi-remittance/**'
      - 'ui-kit/**'
      - '.github/workflows/publish-prototype-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prototype-static-preview
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout prototype working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify crypto withdrawal network confirmation (Playwright)
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 tests/bank-qa/crypto-network-confirm.py
          python3 tests/bank-qa/source-flows.py
      - name: Publish an isolated Pages snapshot, not a source merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/preview-main" origin/main
          PREVIEW="$RUNNER_TEMP/preview-main/preview/prototype"
          mkdir -p "$PREVIEW"
          for dir in assets components css sheet showcase tokens transfi-remittance ui-kit; do
            if [ -d "$dir" ]; then
              mkdir -p "$PREVIEW/$dir"
              rsync -a --delete "$dir/" "$PREVIEW/$dir/"
            fi
          done
          cat > "$PREVIEW/index.html" <<'HTML'
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>alt.vu — предпросмотр прототипа</title><style>body{font-family:Inter,system-ui,sans-serif;color:#161514;background:#f6f7f8;margin:0;padding:40px 20px}main{max-width:680px;margin:auto}h1{font-size:28px}p{font-size:15px;line-height:1.6;color:#555}a{display:block;text-decoration:none;color:#161514;padding:22px 24px;background:white;border:1px solid #ddd;border-radius:16px;margin:12px 0;font-weight:600}a:hover{border-color:#12833a}small{display:block;color:#666;font-weight:400;margin-top:7px}</style></head><body><main><p>alt.vu / work/prototype</p><h1>Предпросмотр рабочего прототипа</h1><p>Отдельная сборка ветки work/prototype. Основной прототип и новая дизайн-система не изменяются.</p><a href="./transfi-remittance/">Открыть прототип<small>Интерактивный кошелёк</small></a><a href="./ui-kit/">UI Kit ветки прототипа<small>Референсная библиотека</small></a></main></body></html>
          HTML
          cd "$RUNNER_TEMP/preview-main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/prototype
          if git diff --cached --quiet; then
            echo "Prototype preview already up to date."
            exit 0
          fi
          git commit -m "deploy(preview): sync isolated prototype build"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Published prototype preview without merging source."
              exit 0
            fi
            sleep 3
          done
          echo "Unable to publish prototype preview after retries" >&2
          exit 1
