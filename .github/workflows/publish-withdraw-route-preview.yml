name: Publish isolated withdrawal route experiment

on:
  push:
    branches: [experiment/withdraw-route]
    paths:
      - 'assets/**'
      - 'components/**'
      - 'css/**'
      - 'sheet/**'
      - 'showcase/**'
      - 'tokens/**'
      - 'transfi-remittance/**'
      - 'ui-kit/**'
      - 'tests/withdraw-route-smoke.py'
      - 'tests/field-clear-smoke.py'
      - 'tests/method-sheet-parity.py'
      - '.github/workflows/publish-withdraw-route-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: withdraw-route-static-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout withdrawal experiment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare Python for Playwright
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          # Chrome is preinstalled on the Ubuntu GitHub runner; avoid the large
          # Chromium download that can stall or queue preview publications.
          google-chrome --version
      - name: Stage canonical design-system branch for local browser verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/design-system
          git worktree add --detach "$GITHUB_WORKSPACE/design-system" origin/work/design-system
          test -f design-system/css/alt-vu-wallet.css
          test -f design-system/css/design-system.css
          test -f design-system/tokens/tokens.css
      - name: Verify canonical method markup, rendered selector layout and actions (390/430/1440; light/dark)
        run: python tests/method-sheet-parity.py
      - name: Validate experimental withdrawals (390/430/1440)
        run: python tests/withdraw-route-smoke.py
      - name: Validate shared text, amount and FX input clearing
        run: python tests/field-clear-smoke.py
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-experiment-screenshots
          path: artifacts/withdraw-route/*.png
          if-no-files-found: ignore
      - name: Publish an isolated Pages snapshot, not a source merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/preview-main" origin/main
          PREVIEW="$RUNNER_TEMP/preview-main/preview/withdraw-route"
          mkdir -p "$PREVIEW"
          for dir in assets components css sheet showcase tokens transfi-remittance; do
            if [ -d "$dir" ]; then
              mkdir -p "$PREVIEW/$dir"
              rsync -a --delete "$dir/" "$PREVIEW/$dir/"
            fi
          done
          # The old branch-local UI Kit is retired. Keep a tiny redirect so
          # existing bookmarks land in the single canonical design-system kit.
          rm -rf "$PREVIEW/ui-kit"
          mkdir -p "$PREVIEW/ui-kit"
          cat > "$PREVIEW/ui-kit/index.html" <<'HTML'
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=../../design-system/ui-kit/#g-experiments"><title>alt.vu — единый UI Kit</title></head><body><p>Экспериментальная библиотека объединена с <a href="../../design-system/ui-kit/#g-experiments">единым UI Kit дизайн-системы</a>.</p><script>location.replace("../../design-system/ui-kit/#g-experiments");</script></body></html>
          HTML
          cat > "$PREVIEW/index.html" <<'HTML'
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>alt.vu — предпросмотр прототипа</title><style>body{font-family:Inter,system-ui,sans-serif;color:#161514;background:#f6f7f8;margin:0;padding:40px 20px}main{max-width:680px;margin:auto}h1{font-size:28px}p{font-size:15px;line-height:1.6;color:#555}a{display:block;text-decoration:none;color:#161514;padding:22px 24px;background:white;border:1px solid #ddd;border-radius:16px;margin:12px 0;font-weight:600}a:hover{border-color:#12833a}small{display:block;color:#666;font-weight:400;margin-top:7px}</style></head><body><main><p>alt.vu / experiment/withdraw-route</p><h1>Предпросмотр рабочего прототипа</h1><p>Отдельная сборка ветки experiment/withdraw-route. Main, work/prototype и work/design-system не изменяются.</p><a href="./transfi-remittance/">Открыть прототип<small>Интерактивный кошелёк</small></a><a href="../design-system/ui-kit/#g-experiments">Единый UI Kit<small>Экспериментальные компоненты в основной дизайн-системе</small></a></main></body></html>
          HTML
          cd "$RUNNER_TEMP/preview-main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/withdraw-route
          if git diff --cached --quiet; then
            echo "Route preview already up to date."
            exit 0
          fi
          git commit -m "deploy(preview): sync isolated prototype build"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Published route preview without merging source."
              exit 0
            fi
            sleep 3
          done
          echo "Unable to publish prototype preview after retries" >&2
          exit 1
