name: Inventory local typography in UI Kit
on:
  workflow_dispatch:
  push:
    branches: [work/design-system]
    paths: ['tests/design-system/local-style-audit.mjs','.github/workflows/local-style-audit.yml']
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright@1.56.1
      - run: node tests/design-system/local-style-audit.mjs
