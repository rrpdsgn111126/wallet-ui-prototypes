name: Inventory local typography in UI Kit
on:
  workflow_dispatch:
  push:
    branches: [work/design-system]
    paths:
      - 'css/**'
      - 'tokens/**'
      - 'showcase/**'
      - 'components/**'
      - 'ui-kit/**'
      - 'tests/design-system/local-style-audit.mjs'
      - '.github/workflows/local-style-audit.yml'
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright@1.56.1
      - name: Assert no local or unbound typography in UI Kit
        run: node tests/design-system/local-style-audit.mjs --assert-clean
