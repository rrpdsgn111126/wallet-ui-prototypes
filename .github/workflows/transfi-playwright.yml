name: TransFi Playwright smoke
on:
  push:
    branches: [main]
    paths:
      - 'transfi-remittance/legacy.html'
      - '.github/workflows/transfi-playwright.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Validate inline JavaScript syntax
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('transfi-remittance/legacy.html','utf8');fs.writeFileSync('/tmp/transfi-check.js',h.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/transfi-check.js
      - name: Check flow in Chromium
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({channel:'chrome',headless:true});
            try{
              for(const width of [390,1440]){
                const page=await browser.newPage({viewport:{width,height:900}});
                page.setDefaultTimeout(9000);
                const errors=[];
                page.on('pageerror',error=>errors.push(String(error)));
                await page.goto('file://'+path.resolve('transfi-remittance/legacy.html'),{waitUntil:'domcontentloaded'});
                await page.locator('.tf-source-home').waitFor({state:'visible'});
                for(const [selector,title] of [
                  ['.tf-bottom-nav [data-mb="profile"]','Профиль'],
                  ['.tf-bottom-nav [data-mb="card"]','Карта'],
                  ['.tf-source-home .ha[data-go="notes"]','Уведомления'],
                  ['.tf-source-home .hh [data-go="history"]','История']
                ]){
                  await page.locator(selector).click();
                  if(await page.locator('#phoneTitle').innerText()!==title)
                    throw Error(title+' navigation failed');
                  await page.locator('.phone.tf-phone .back').click();
                }
                if(!await page.locator('.tf-visa-brand').isVisible())throw Error('Source card missing');
                await page.locator('.tf-bottom-nav [data-mb="topup"]').click();
                await page.locator('#methodLayer .tf-method-row').filter({hasText:'SEPA'}).click();
                await page.locator('.tf-deposit-currency').waitFor();
                if((await page.locator('.tf-deposit-currency b').innerText())!=='EUR')throw Error('SEPA must use fixed EUR');
                await page.locator('.phone.tf-phone .back').click();
                await page.locator('.tf-bottom-nav [data-mb="topup"]').click();
                await page.locator('#methodLayer .tf-method-row').filter({hasText:'SWIFT'}).click();
                const incoming=page.locator('[data-picker="inCurrency"]');
                await incoming.click();
                await page.locator('[data-picker-value="USD"]').click();
                if(!(await incoming.innerText()).includes('USD')||!(await page.locator('.tf-requisites').innerText()).includes('DEMOUS00'))
                  throw Error('SWIFT currency picker did not update bank details');
                await page.locator('.phone.tf-phone .back').click();
                await page.locator('.tf-bottom-nav [data-mb="withdraw"]').click();
                await page.locator('#methodLayer .tf-method-row').filter({hasText:'SWIFT'}).click();
                await page.locator('#tf-out-amount').fill('100');
                await page.getByRole('button',{name:'Продолжить'}).click();
                await page.locator('#f-recipientName').fill('Иван Иванов');
                await page.locator('#f-account').fill('000000000000');
                await page.locator('#f-bic').fill('DEMOXXXX');
                await page.locator('#f-bank').fill('Банк получателя');
                await page.getByRole('button',{name:'Проверить перевод'}).click();
                if((await page.locator('#phoneTitle').innerText())!=='Проверьте перевод')
                  throw Error('Review title not canonical');
                const labels=await page.locator('.tf-review-quote .row .rt').allInnerTexts();
                if(labels.join('|')!=='Сумма перевода|Курс|Комиссия|Спишется со счёта')
                  throw Error('Review rows not in canonical order: '+labels.join('|'));
                if(!(await page.locator('.tf-review-quote').innerText()).includes('118,00 $'))
                  throw Error('SWIFT USD debit must include fee');
                await page.getByRole('button',{name:'Перевести 92,59 EUR'}).click();
                await page.locator('.tf-bank-wait .ring').waitFor();
                if(await page.locator('.timeline').count())throw Error('Legacy timeline still visible');
                await page.evaluate(()=>uxBankCallback('success'));
                await page.locator('.tf-bank-result .okc').waitFor();
                if((await page.locator('.tf-bank-result .h2').innerText())!=='Перевели 92,59 EUR')
                  throw Error('Success amount mismatch');
                await page.evaluate(()=>{go('out-progress');uxBankCallback('failed')});
                await page.locator('.tf-bank-result .sbp-ic').waitFor();
                if(errors.length)throw Error('JavaScript errors: '+errors.join(' / '));
                console.log('BANK_FLOW_NATIVE_PARITY_OK',width);
                await page.close();
              }
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exit(1)});
          JS
