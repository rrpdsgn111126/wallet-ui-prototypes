name: TransFi Playwright smoke
on:
  push:
    branches: [main]
    paths:
      - 'transfi-remittance/index.html'
      - '.github/workflows/transfi-playwright.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1
      - name: Validate inline JavaScript syntax
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('transfi-remittance/index.html','utf8');fs.writeFileSync('/tmp/transfi-check.js',h.split('<script>')[1].split('</script>')[0])"
          node --check /tmp/transfi-check.js
      - name: Check flow in Chromium
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({channel:'chrome',headless:true});
            for(const width of [390,1440]) {
              const page=await browser.newPage({viewport:{width,height:900}});
              page.setDefaultTimeout(7000);
              const errors=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',msg=>{if(msg.type()==='error')errors.push(msg.text())});
              await page.goto('file://'+path.resolve('transfi-remittance/index.html'),{waitUntil:'domcontentloaded'});
              await page.waitForTimeout(200);
              const snapshot=async(label)=>console.log(JSON.stringify({width,label,title:await page.locator('#phoneTitle').innerText().catch(()=>null),steps:await page.locator('#stageLabel').innerText().catch(()=>null),errors:[...errors]}));
              await snapshot('initial');
              if(errors.length)throw Error('JS initialization error: '+errors.join(' / '));
              await page.locator('.tf-home-action.primary').click();
              if(!await page.locator('#methodLayer .tf-method-sheet').isVisible())throw Error('Deposit method sheet not visible');
              await page.locator('#methodLayer .tf-method-row').filter({hasText:'SEPA'}).click();
              await snapshot('SEPA details directly');
              if(!await page.getByText('Валюта пополнения',{exact:true}).isVisible())throw Error('SEPA currency label missing');
              if(!await page.locator('#content .tf-deposit-currency b').isVisible())throw Error('SEPA static currency missing');
              if((await page.locator('#content .tf-deposit-currency b').innerText())!=='EUR')throw Error('SEPA currency must be EUR');
              if(await page.locator('#content .tf-deposit-currency select').count())throw Error('SEPA currency must not be selectable');
              if(!await page.locator('#content .tf-requisites').isVisible())throw Error('SEPA bank details missing');
              if(await page.getByRole('button',{name:'Получить реквизиты'}).count())throw Error('Obsolete intermediate currency screen');
              if(!await page.getByRole('button',{name:'Скопировать все реквизиты'}).isVisible())throw Error('Copy details action missing');
              await page.locator('.phone.tf-phone .back').click();
              if(!await page.locator('#methodLayer .tf-method-sheet').isVisible())throw Error('Back from SEPA must open method sheet');
              await page.locator('#methodLayer .tf-method-row').filter({hasText:'SWIFT'}).click();
              await snapshot('SWIFT details directly');
              const currencySelect=page.getByRole('combobox',{name:'Валюта пополнения'});
              if(!await currencySelect.isVisible())throw Error('SWIFT currency selector missing');
              if(!await page.locator('#content .tf-requisites').isVisible())throw Error('SWIFT bank details missing');
              await currencySelect.selectOption('USD');
              await snapshot('SWIFT USD bank details');
              if((await currencySelect.inputValue())!=='USD')throw Error('SWIFT currency selection not persisted');
              if(!await page.getByText('DEMOUS00',{exact:true}).isVisible())throw Error('SWIFT bank details did not refresh for USD');
              if(await page.getByRole('button',{name:'Получить реквизиты'}).count())throw Error('SWIFT has obsolete currency step');
              if(width<740) {
                await page.locator('.phone.tf-phone .back').click();
                await page.locator('#methodLayer .tf-method-dim').click({position:{x:10,y:10}});
              } else {
                await page.locator('#flow-home').click();
              }
              await page.locator('.tf-home-action').filter({hasText:'Вывести'}).click();
              await page.locator('#methodLayer .tf-method-row').filter({hasText:'SWIFT'}).click();
              await snapshot('out SWIFT');
              await page.getByRole('button',{name:'Продолжить'}).click();
              await snapshot('out recipient');
              if(!await page.locator('#f-firstName').isVisible())throw Error('recipient fields missing');
              if(errors.length)throw Error('JS console/page errors: '+errors.join(' / '));
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
