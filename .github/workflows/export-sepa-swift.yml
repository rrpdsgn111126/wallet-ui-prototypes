name: Export SEPA SWIFT screen flows

on:
  push:
    branches: [main]
    paths:
      - 'tests/bank-qa/export-screenshots.py'
      - 'tests/bank-qa/export-wallet-entry-receipts.py'
      - '.github/workflows/export-sepa-swift.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture actual app screens
        run: |
          python tests/bank-qa/export-screenshots.py
          python tests/bank-qa/export-wallet-entry-receipts.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SEPA-SWIFT-all-screen-flows-2026-11-16
          path: exports/transfi-flows-2026-11-16/
          retention-days: 30
      - name: Print screenshot inventory
        if: always()
        run: find exports/transfi-flows-2026-11-16 -type f | sort
